name: Temporary AITP-112 dedupe

on:
  push:
    branches:
      - test/aitp-112-overlay-geometry

permissions:
  contents: write

jobs:
  dedupe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/aitp-112-overlay-geometry

      - name: Remove superseded unclamped geometry helper and test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("e2e/tests/vscode-basics.spec.ts")
          text = path.read_text()

          old_helper = '''async function expectSpotlightAround(spotlight: Locator, target: Locator): Promise<void> {\n  await expect(spotlight).toBeVisible();\n  await expect\n    .poll(async () => {\n      const [spotlightBox, targetBox] = await Promise.all([\n        spotlight.boundingBox(),\n        target.boundingBox(),\n      ]);\n      if (!spotlightBox || !targetBox) return null;\n\n      return {\n        top: Math.round(spotlightBox.y - targetBox.y),\n        right: Math.round(spotlightBox.x + spotlightBox.width - (targetBox.x + targetBox.width)),\n        bottom: Math.round(spotlightBox.y + spotlightBox.height - (targetBox.y + targetBox.height)),\n        left: Math.round(spotlightBox.x - targetBox.x),\n      };\n    })\n    .toEqual({ top: -6, right: 6, bottom: 6, left: -6 });\n}\n\n'''
          old_test = '''test("Guided: Highlight-Rahmen umschließt das semantische Ziel geometrisch", async ({ page }) => {\n  await page.goto(guidedUrl);\n  await waitForTrainingReady(page);\n\n  const spotlight = page.getByTestId("highlight-spotlight");\n  const explorer = page.getByRole("button", { name: "Explorer", exact: true });\n  await expectSpotlightAround(spotlight, explorer);\n\n  await explorer.click();\n  await expectGuidedStep(page, 2, "Einen Ordner als Arbeitskontext öffnen");\n  await expectSpotlightAround(spotlight, page.getByRole("button", { name: "File", exact: true }));\n});\n\n'''

          if text.count("async function expectSpotlightAround") != 2:
              raise SystemExit("Expected exactly two geometry helpers before dedupe")
          if old_helper not in text:
              raise SystemExit("Superseded unclamped helper not found")
          if old_test not in text:
              raise SystemExit("Superseded unclamped test not found")

          text = text.replace(old_helper, "", 1).replace(old_test, "", 1)
          path.write_text(text)
          PY
          npx prettier --write e2e/tests/vscode-basics.spec.ts
          rm .github/workflows/tmp-aitp-112-dedupe.yml
          git add -A
          git commit -m "test: remove superseded overlay geometry assertion"
          git push origin HEAD:test/aitp-112-overlay-geometry
