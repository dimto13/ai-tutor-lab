name: AITP-23 Review Fix

on:
  push:
    branches:
      - feat/aitp-23-terminal-simulator

permissions:
  contents: write

jobs:
  fix-path-resolution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Fix workspace-relative path handling and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          engine = Path("src/runtime/terminalCommandEngine.ts")
          text = engine.read_text()
          old = '  if (!value || value === "~" || value === "/" || value === context.workspaceRoot) return "";'
          new = '  if (!value || value === "~" || value === "/") return "";'
          if old not in text:
              raise SystemExit("resolvePath guard not found")
          engine.write_text(text.replace(old, new, 1))

          test_file = Path("tests/runtime/terminalCommandEngine.test.ts")
          tests = test_file.read_text()
          marker = 'test("terminal engine stages and commits the actual changed files", () => {'
          regression = '''test("terminal engine resolves a bare workspace name relative to the current directory", () => {
            let context = baseContext();

            const nested = executeTerminalCommand("cd src", context);
            assert.equal(nested.exitCode, 0);
            assert.equal(nested.cwd, "src");
            context = nextContext(context, nested);

            const bareWorkspace = executeTerminalCommand("cd ai-training-demo", context);
            assert.equal(bareWorkspace.exitCode, 1);
            assert.equal(bareWorkspace.cwd, "src");
            assert.match(bareWorkspace.output.join("\\n"), /No such file or directory/);

            const explicitWorkspace = executeTerminalCommand("cd ~/ai-training-demo", context);
            assert.equal(explicitWorkspace.exitCode, 0);
            assert.equal(explicitWorkspace.cwd, "");
          });

          '''
          if regression not in tests:
              if marker not in tests:
                  raise SystemExit("test insertion marker not found")
              tests = tests.replace(marker, regression + marker, 1)
              test_file.write_text(tests)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/terminalCommandEngine.ts tests/runtime/terminalCommandEngine.test.ts
          git diff --cached --check
          git commit -m "fix: resolve bare workspace paths relative to cwd"
          git push
