                        { "region": "Süd", "revenue": "114 500 EUR", "cost": "83.000 €" },
                        { "region": "Ost", "revenue": "96.000 €", "cost": "72 000 EUR" },
                        { "region": "West", "revenue": "131.000 €", "cost": "94.500 €" }
