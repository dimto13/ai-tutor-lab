name: Apply AITP-155

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/aitp-155-table-data-workflow
          fetch-depth: 0

      - name: Add table data workflow content
        shell: bash
        run: |
          cat > content/scenarios/table-data-workflow.guided.json <<'EOF'
          {
            "id": "table-data-workflow.guided",
            "moduleId": "table-data-workflow",
            "mode": "guided",
            "learningLayer": "ai_workflow",
            "title": "Tabellendaten auswerten – Annahmen, Berechnung und Plausibilitätscheck",
            "description": "Bereinige eine kleine Umsatz-/Kostentabelle, bestätige die Rechenannahmen, lasse Gewinn und Marge berechnen, iteriere das Ergebnis und finde anschließend eine unbemerkt verlorene Region.",
            "audience": {
              "personaId": "non-programmer",
              "glossaryConcepts": [
                "data.table",
                "data.assumption",
                "data.plausibility_check",
                "artifact.preview",
                "github.copilot",
                "copilot.chat"
              ]
            },
            "environment": {
              "productId": "vscode",
              "version": "1.x",
              "runtimeAdapterId": "vscode-simulator",
              "integrations": [
                {
                  "productId": "github-copilot",
                  "version": "2026.08",
                  "runtimeAdapterId": "github-copilot-vscode-simulator"
                },
                {
                  "productId": "artifact-preview",
                  "version": "1.x",
                  "runtimeAdapterId": "artifact-preview-simulator"
