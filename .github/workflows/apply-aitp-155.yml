      - name: Register glossary concepts and scenario
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          # Glossary concepts for business data analysis.
          path = Path("content/glossary/de.json")
          data = json.loads(path.read_text())
          keys = {item["key"] for item in data["concepts"]}
          new = [
              {
                  "key": "data.table",
                  "term": "Tabelle",
                  "aliases": ["Tabellendaten", "Datentabelle"],
                  "simple": "Eine Tabelle ordnet zusammengehörige Werte in Zeilen und Spalten. Eine Zeile steht hier für eine Region, die Spalten beschreiben Merkmale wie Umsatz oder Kosten.",
                  "advanced": "Tabellen sind strukturierte Datensätze. Für belastbare Auswertungen müssen Datentypen, Einheiten, fehlende Werte und eindeutige Zeilenbezüge vor der Berechnung geklärt sein.",
                  "uiTargets": []
              },
              {
                  "key": "data.assumption",
                  "term": "Annahme",
                  "aliases": ["Rechenannahme", "fachliche Annahme"],
                  "simple": "Eine Annahme ist eine Regel, die du vor der Rechnung festlegst, zum Beispiel was genau als Gewinn oder Marge gelten soll.",
                  "advanced": "Annahmen definieren die fachliche Bedeutung einer Berechnung. Sie müssen vor der Auswertung explizit, überprüfbar und bei Änderungen nachvollziehbar sein.",
                  "uiTargets": []
              },
              {
                  "key": "data.plausibility_check",
                  "term": "Plausibilitätsprüfung",
                  "aliases": ["Plausibilitätscheck", "Gegenprüfung"],
                  "simple": "Bei einer Plausibilitätsprüfung kontrollierst du, ob ein Ergebnis vollständig und in sich sinnvoll ist – zum Beispiel ob nach einer Bearbeitung noch alle Regionen vorhanden sind.",
                  "advanced": "Plausibilitätsprüfungen vergleichen Ergebnis, Referenzdaten und fachliche Erwartungen. Sie erkennen Fehler, die trotz formal korrekter Berechnung entstehen können.",
                  "uiTargets": []
              }
          ]
          for concept in new:
              if concept["key"] not in keys:
                  data["concepts"].append(concept)
          data["version"] = max(int(data.get("version", 1)), 6)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          # Register guided scenario alongside the other AI workflows.
          path = Path("src/scenarios/index.ts")
          text = path.read_text()
          import_line = 'import tableDataWorkflowData from "../../content/scenarios/table-data-workflow.guided.json" with { type: "json" };\n'
          if import_line not in text:
              matches = list(re.finditer(r'^import .*research-workflow\.guided\.json.*\n', text, re.M))
              if not matches:
                  raise SystemExit("research workflow import not found")
              pos = matches[-1].end()
              text = text[:pos] + import_line + text[pos:]
          if "parseScenario(tableDataWorkflowData)" not in text:
              marker = "parseScenario(researchWorkflowData)"
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit("research workflow registration not found")
              line_end = text.find("\n", idx)
              current_line = text[text.rfind("\n", 0, idx)+1:line_end]
              indent = current_line[:len(current_line)-len(current_line.lstrip())]
              insertion = f'{indent}parseScenario(tableDataWorkflowData),\n'
              text = text[:line_end+1] + insertion + text[line_end+1:]
          path.write_text(text)
          PY

      - name: Add workflow contract tests
        shell: bash
        run: |
          cat > tests/runtime/tableDataWorkflowContent.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import tableDataWorkflowData from "../../content/scenarios/table-data-workflow.guided.json" with { type: "json" };
          import { parseScenario } from "../../src/scenarios/contentLoader.ts";

          test("table workflow preserves four source regions and restores the silently lost region", () => {
            const scenario = parseScenario(tableDataWorkflowData);
            const seed = scenario.environment?.seed as Record<string, unknown>;
            const preview = seed.artifactPreview as {
              artifacts: Array<{ id: string; rows?: Array<Record<string, unknown>> }>;
              revisions: Array<{
                id: string;
                next: { rows?: Array<Record<string, unknown>> };
              }>;
            };

            const source = preview.artifacts.find((artifact) => artifact.id === "source-table");
            assert.deepEqual(source?.rows?.map((row) => row.region), ["Nord", "Süd", "Ost", "West"]);

            const margin = preview.revisions.find((revision) => revision.id === "add-margin");
            assert.deepEqual(margin?.next.rows?.map((row) => row.region), ["Nord", "Süd", "West"]);

            const restored = preview.revisions.find((revision) => revision.id === "restore-east");
            assert.deepEqual(restored?.next.rows?.map((row) => row.region), [
              "Nord",
              "Süd",
              "Ost",
              "West",
            ]);
          });

          test("missing-region answer is intentionally exact free-text validation", () => {
            const scenario = parseScenario(tableDataWorkflowData);
            const step = scenario.steps.find((candidate) => candidate.id === "find-missing-region");
            assert.equal(step?.exactTextValidation, true);
            assert.deepEqual(step?.validation, {
              kind: "event",
              type: "copilot.prompt.submitted",
              contains: { prompt: "Ost" },
            });
          });
          EOF

          cat > e2e/tests/table-data-workflow.spec.ts <<'EOF'
          import { expect, test, type Page } from "@playwright/test";

