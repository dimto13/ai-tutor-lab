                },
                "openTabs": ["analyse-notiz.md"],
                "activeFile": "analyse-notiz.md",
                "chatResponses": [
                  {
                    "promptContains": "Ost",
                    "response": "Plausibilitätscheck bestätigt: In den Ausgangsdaten sind Nord, Süd, Ost und West enthalten. In der aktuellen Auswertung fehlt Ost. Korrigiere nur diesen Verlust und behalte die übrigen Berechnungen bei."
