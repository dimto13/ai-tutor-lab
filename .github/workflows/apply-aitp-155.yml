                      "id": "working-table",
                      "type": "table",
                      "title": "Arbeitstabelle",
                      "description": "Kopie der Ausgangsdaten für Bereinigung und Berechnung.",
                      "columns": [
                        { "key": "region", "label": "Region" },
                        { "key": "revenue", "label": "Umsatz" },
                        { "key": "cost", "label": "Kosten" }
                      ],
