      - name: Write workflow documentation
        shell: bash
        run: |
          cat > docs/18-tabellendaten-workflow.md <<'EOF'
          # 18 — AI-Workflow: Tabellendaten auswerten

          `table-data-workflow.guided` ist der dritte businessnahe AI-Workflow neben Recherche und HTML-Erstellung. Er richtet sich an die Persona `non-programmer` und verlangt weder Tabellenformeln noch Programmcode vom Nutzer.

          ## Lernmuster

          1. **Referenz sichern:** Ausgangsdaten bleiben unverändert sichtbar.
          2. **Daten bereinigen:** uneinheitliche Zahlenformate werden in eine rechenbare Form überführt.
          3. **Annahmen bestätigen:** Zeitraum, Währung und Rechenregeln werden vor der Berechnung geprüft.
          4. **Berechnen:** Gewinn wird nachvollziehbar aus Umsatz minus Kosten abgeleitet.
          5. **Iterieren:** die Marge wird als zusätzliche Kennzahl ergänzt.
          6. **Plausibilität prüfen:** Ergebnis wird gegen die Referenz verglichen; eine unbemerkt verlorene Region muss erkannt werden.
          7. **Gezielt korrigieren:** nur der gefundene Datenverlust wird repariert.
          8. **Freigeben:** erst der korrigierte und gegengeprüfte Endstand wird als geprüft markiert.

          ## Technische Umsetzung

          Der Workflow nutzt ausschließlich bestehende Runtime-Verträge:

          - `vscode-simulator` als Host-Arbeitsbereich,
          - `github-copilot-vscode-simulator` für die KI-Interaktion beim Plausibilitätscheck,
          - `artifact-preview-simulator` für Ausgangsdaten, Arbeitstabelle, Annahmen und deterministische Revisionen.

          Es entsteht keine tabellenspezifische React-Sonderkomponente. Die Tabellenzustände liegen vollständig im Szenario-Seed und können später durch andere Datensätze oder Anbieter ersetzt werden.

          Die absichtlich fehlende Region `Ost` ist eine fachliche Antwort und deshalb bewusst mit `exactTextValidation: true` abgesichert. Das ist keine Magic-Word-Validierung, sondern das eigentliche Ergebnis des Plausibilitätschecks.
          EOF

