            await page.getByRole("button", { name: "Arbeitstabelle", exact: true }).click();
            await page.getByRole("button", { name: "Zahlenformate bereinigen", exact: true }).click();
            await expect(
              page.getByRole("heading", { name: "Schritt 3 – Rechenannahmen vor der Berechnung bestätigen" }),
            ).toBeVisible();

            await page.getByRole("button", { name: "Annahmen", exact: true }).click();
            await page.getByRole("button", { name: "Ergebnis geprüft", exact: true }).click();
            await expect(
              page.getByRole("heading", { name: "Schritt 4 – Gewinn berechnen lassen" }),
            ).toBeVisible();

            await page.getByRole("button", { name: "Arbeitstabelle", exact: true }).click();
            await page.getByRole("button", { name: "Gewinn berechnen", exact: true }).click();
            await page.getByRole("button", { name: "Marge in Prozent ergänzen", exact: true }).click();
            await expect(
              page.getByRole("heading", {
