name: AITP-80 format current source tree

on:
  push:
    branches:
      - feature/aitp-80-remove-lovable-tooling

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/aitp-80-remove-lovable-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --install-strategy=nested

      - name: Format source tree
        run: npx prettier --write "src/**/*.{ts,tsx}"

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "AITP-80 format current source tree"
          git push origin HEAD:feature/aitp-80-remove-lovable-tooling
