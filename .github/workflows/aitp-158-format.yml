name: AITP-158 Format

on:
  push:
    branches:
      - agent/aitp-158-feedback-capture

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aitp-158-feedback-capture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --install-strategy=nested
      - run: npx prettier --write apps/web/src/components/feedback/FeedbackCapture.tsx apps/web/e2e/tests/feedback-capture.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/feedback/FeedbackCapture.tsx apps/web/e2e/tests/feedback-capture.spec.ts
          git commit -m "style: format AITP-158 feedback files"
          git push origin HEAD:agent/aitp-158-feedback-capture
