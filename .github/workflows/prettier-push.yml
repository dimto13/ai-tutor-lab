name: Prettier Push

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/aitp-168-help-escalation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npx prettier --write .

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply prettier to AITP-168 audit"
          git push origin HEAD:agent/aitp-168-help-escalation
