name: Temporary patch AITP-139 runner

on:
  push:
    branches:
      - feat/aitp-139-source-control-platform-basics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aitp-139-source-control-platform-basics
      - name: Add dependency installation to integration runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-aitp-139-merge-probe.yml')
          text = path.read_text()
          old = '          npx prettier --write \\\n'
          new = '          npm ci\n          npx prettier --write \\\n'
          if old not in text:
              raise SystemExit('Prettier runner anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-patch-aitp-139-runner.yml
          git add -A
          git commit -m "ci: install dependencies for AITP-139 integration"
          git push origin HEAD:feat/aitp-139-source-control-platform-basics
