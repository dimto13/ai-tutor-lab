name: Cloud Release Acceptance Trigger

# Unprivilegierter Marker fuer einen neuen Owner-gesteuerten deploy-Stand.
# Der nachgelagerte Cloud-Acceptance-Workflow startet ueber workflow_run auf dem Default-Branch.
# Dadurch braucht dieser Workflow weder AWS-Rechte noch actions:write.

on:
  push:
    branches:
      - deploy

permissions:
  contents: read

concurrency:
  group: cloud-release-acceptance-trigger
  cancel-in-progress: false

jobs:
  mark-release:
    name: Mark exact deploy SHA
    runs-on: ubuntu-latest
    steps:
      - name: Exakten deploy-SHA als Trigger-Evidence ausgeben
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${DEPLOY_SHA}" in
            *[!0-9a-fA-F]*|"")
              echo "::error::Ungueltiger deploy-SHA: ${DEPLOY_SHA}"
              exit 1
              ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "::error::deploy-SHA muss 40-stellig sein."
            exit 1
          fi
          {
            echo "### Cloud release acceptance trigger"
            echo ""
            echo "- deploy SHA: \`${DEPLOY_SHA}\`"
            echo "- downstream: \`Cloud Acceptance\` via \`workflow_run\`"
          } >> "${GITHUB_STEP_SUMMARY}"
