name: Cloud Release Acceptance Trigger

# Ein deploy-Push startet keine AWS-Arbeit direkt in diesem Workflow. Er dispatcht die
# read-only Cloud Acceptance bewusst auf main, damit die bestehende cloud-acceptance
# Environment-/OIDC-Trust-Grenze unveraendert bleibt. workflow_dispatch ist die von GitHub
# vorgesehene Ausnahme, die auch mit dem Repository-GITHUB_TOKEN einen Folgelauf erzeugt.

on:
  push:
    branches:
      - deploy

permissions:
  actions: write
  contents: read

concurrency:
  group: cloud-release-acceptance-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch exact deploy acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Cloud Acceptance auf main fuer exakten deploy-SHA starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload=$(jq -n             --arg ref "main"             --arg sha "${DEPLOY_SHA}"             '{ref:$ref, inputs:{log_window:"1h", expected_deploy_sha:$sha}}')
          curl --fail-with-body --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/cloud-acceptance.yml/dispatches"             --data "${payload}"
          {
            echo "### Cloud release acceptance dispatched"
            echo ""
            echo "- deploy SHA: \`${DEPLOY_SHA}\`"
            echo "- target workflow ref: \`main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
