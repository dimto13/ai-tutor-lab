name: AITP-81 Final Format

on:
  push:
    branches:
      - agent/aitp-81-monorepo

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aitp-81-monorepo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --install-strategy=nested
      - name: Format final AITP-81 files
        run: |
          npx prettier --write \
            packages/training-engine/src/types.ts \
            packages/training-engine/src/eventBus.ts \
            apps/web/src/scenarios/contentLoader.ts \
            tests/runtime/contentLoader.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/training-engine/src/types.ts \
            packages/training-engine/src/eventBus.ts \
            apps/web/src/scenarios/contentLoader.ts \
            tests/runtime/contentLoader.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format final AITP-81 files"
          git push origin HEAD:agent/aitp-81-monorepo
