name: AITP-81 One-shot Format Types

on:
  push:
    branches:
      - agent/aitp-81-monorepo

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aitp-81-monorepo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --install-strategy=nested
      - name: Format engine types
        run: npx prettier --write packages/training-engine/src/types.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/training-engine/src/types.ts
          git commit -m "style: apply Prettier to training engine types"
          git push
