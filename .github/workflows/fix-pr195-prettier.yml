name: Fix PR195 Prettier

on:
  push:
    branches:
      - fix/remove-temporary-aitp155-runner

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-temporary-aitp155-runner
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --install-strategy=nested
      - run: npx prettier --write e2e/tests/copilot-basics.spec.ts
      - run: rm -f .github/workflows/fix-pr195-prettier.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format Copilot E2E assertion"
          git push origin HEAD:fix/remove-temporary-aitp155-runner
