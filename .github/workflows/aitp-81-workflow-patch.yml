name: Patch AITP-81 Migration

on:
  push:
    branches:
      - agent/aitp-81-monorepo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aitp-81-monorepo
      - name: Patch provider architecture scan for monorepo roots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/aitp-81-migrate.yml')
          text = workflow.read_text()
          needle = '''          set -euo pipefail
          npm install --install-strategy=nested --no-audit --no-fund
'''
          replacement = '''          set -euo pipefail
          python3 - <<'PYTEST'
          from pathlib import Path

          test_file = Path("tests/runtime/llmProvider.test.ts")
          source = test_file.read_text()
          old = ''' + "'''" + '''  const srcRoot = path.resolve("src");
  const allowedRoot = path.resolve("src/tutor/llm");
  const forbidden = ["LLM_BASE_URL", "LLM_API_KEY", "LLM_MODEL", "localhost:11434"];

  for (const file of await collectTypeScriptFiles(srcRoot)) {
    if (file.startsWith(allowedRoot)) continue;
    const content = await readFile(file, "utf8");
    for (const token of forbidden) {
      assert.equal(
        content.includes(token),
        false,
        `${token} leaked into ${path.relative(srcRoot, file)}`,
      );
    }
  }
''' + "'''" + '''
          new = ''' + "'''" + '''  const sourceRoots = [path.resolve("apps/web/src"), path.resolve("packages")];
  const allowedRoot = path.resolve("apps/web/src/tutor/llm");
  const forbidden = ["LLM_BASE_URL", "LLM_API_KEY", "LLM_MODEL", "localhost:11434"];

  for (const sourceRoot of sourceRoots) {
    for (const file of await collectTypeScriptFiles(sourceRoot)) {
      if (file.startsWith(allowedRoot)) continue;
      const content = await readFile(file, "utf8");
      for (const token of forbidden) {
        assert.equal(
          content.includes(token),
          false,
          `${token} leaked into ${path.relative(process.cwd(), file)}`,
        );
      }
    }
  }
''' + "'''" + '''
          if old not in source:
              raise SystemExit("provider architecture scan block not found")
          test_file.write_text(source.replace(old, new))
          PYTEST
          npm install --install-strategy=nested --no-audit --no-fund
'''
          if needle not in text:
              raise SystemExit('migration verification step not found')
          workflow.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit patched migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/aitp-81-migrate.yml
          git commit -m "chore: make provider architecture scan monorepo-aware"
          git push origin HEAD:agent/aitp-81-monorepo
