name: Cloud Acceptance

# Dauerhafter Diagnosekanal GitHub -> AWS -> reale Anwendung.
#
# Der Workflow deployt nichts. Er meldet sich per OIDC mit kurzlebigen Credentials an einer
# ausschliesslich lesenden IAM-Rolle an und macht den realen Zustand der Amplify-Umgebung
# reproduzierbar sichtbar. Statische AWS-Schluessel gibt es in diesem Repository bewusst nicht.
#
# Einrichtung und Erstnachweis: docs/23-cloud-abnahme-kanal.md

on:
  workflow_dispatch:
    inputs:
      log_window:
        description: "Zeitfenster der CloudWatch-Diagnose, z. B. 1h, 30m, 2d"
        required: false
        default: "1h"

concurrency:
  group: cloud-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aws-diagnose:
    name: AWS-Diagnose
    runs-on: ubuntu-latest
    # Das Environment ist Teil der Vertrauensbeziehung: der OIDC-Subject-Claim enthaelt
    # "environment:cloud-acceptance", und nur dafuer erlaubt die AWS-Trust-Policy das Annehmen
    # der Rolle. Die Branch-Beschraenkung des Environments auf main gehoert deshalb zwingend dazu.
    environment: cloud-acceptance
    timeout-minutes: 15
    permissions:
      contents: read
      # Erlaubt dem Job lediglich, ein GitHub-OIDC-Token anzufordern. Ob daraus AWS-Zugriff wird,
      # entscheidet allein die Trust-Policy der Rolle.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Gepinnte Runtime-Toolchain pruefen
        run: node scripts/check-runtime-versions.mjs --toolchain-only

      - name: AWS-Kontonummer in Logs maskieren
        # Dies ist ein oeffentliches Repository, seine Workflow-Logs sind oeffentlich lesbar.
        #
        # Der Rollen-ARN kommt bewusst aus den Secrets, nicht aus den Variablen: GitHub gibt den
        # env-Block eines Schrittes im Log aus, bevor dessen Skript laeuft. Als Variable stuende
        # die Kontonummer damit im Log, noch bevor ::add-mask:: sie schuetzen kann. Secrets
        # maskiert GitHub dagegen von sich aus. Das ist ein Maskierungsmittel, keine Aussage
        # darueber, dass eine Kontonummer geheim waere.
        #
        # Die daraus abgeleitete Maske bleibt trotzdem noetig: Sie deckt die blosse Kontonummer
        # auch dort ab, wo sie in anderen Zeichenketten auftaucht, etwa im assumed-role-ARN der
        # STS-Antwort.
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Environment-Secret AWS_ROLE_ARN fehlt (siehe docs/23-cloud-abnahme-kanal.md)."
            exit 1
          fi
          account=$(printf '%s' "${ROLE_ARN}" | cut -d: -f5)
          # Ein unerwartetes ARN-Format wuerde hier still zu einer leeren Maske fuehren und die
          # Kontonummer in den folgenden Schritten oeffentlich sichtbar lassen. Deshalb Abbruch.
          case "${account}" in
            "" | *[!0-9]*)
              echo "::error::AWS_ROLE_ARN hat nicht das Format arn:aws:iam::<konto>:role/<name>."
              exit 1
              ;;
          esac
          echo "::add-mask::${account}"

      - name: OIDC-Claims dieses Jobs anzeigen
        # Bewusst vor der AWS-Anmeldung: Schlaegt AssumeRole fehl, ist der tatsaechliche
        # Subject-Claim trotzdem sichtbar und die Trust-Policy laesst sich exakt korrigieren,
        # statt das Format zu raten.
        run: |
          set -euo pipefail
          token=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          # Das Token selbst ist ein Credential und wird nie ausgegeben, nur seine Claims.
          echo "::add-mask::${token}"
          payload=$(printf '%s' "${token}" | cut -d. -f2 | tr '_-' '/+')
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          claims=$(printf '%s' "${payload}" | base64 -d | jq '{
            sub, aud, repository, repository_id, repository_owner, repository_owner_id,
            environment, ref, job_workflow_ref
          }')
          echo "${claims}"
          {
            echo "### OIDC-Claims"
            echo ""
            echo '```json'
            echo "${claims}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: AWS-Anmeldung per OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ai-tutor-cloud-acceptance

      - name: Angenommene Rolle pruefen
        run: |
          set -euo pipefail
          arn=$(aws sts get-caller-identity --query 'Arn' --output text)
          echo "Aktive Identitaet: ${arn}"
          case "${arn}" in
            *:assumed-role/*) ;;
            *)
              echo "::error::Unerwartete Identitaet - erwartet wird eine per AssumeRole angenommene Rolle."
              exit 1
              ;;
          esac
          echo "### AWS-Identitaet" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${arn}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Amplify-App lesen
        run: |
          set -euo pipefail
          aws amplify get-app --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --query 'app.{name:name,appId:appId,platform:platform,repository:repository,domain:defaultDomain}' \
            --output table

      - name: Deployment-Zustand ausgeben
        # Wiederverwendung des vorhandenen Diagnoseskripts. Es kennt bereits die aktiven
        # Jobzustaende, die Phasen eines Jobs und den Weg zum Log einer fehlgeschlagenen Phase.
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: npm run amplify:status:once

      - name: Backend-Ressourcen auflisten
        # Breiter Inventarblick fuer #44/#45. Der folgende Bindungs-Schritt beweist anschliessend,
        # welche dieser Ressourcen die live ausgelieferte Anwendung tatsaechlich referenziert.
        # Es werden keine Nutzerdaten und keine Tabelleninhalte gelesen.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          echo "== Cognito User Pools =="
          aws cognito-idp list-user-pools --max-results 20 \
            --query 'UserPools[].{name:Name,id:Id}' --output table
          echo "== AppSync APIs =="
          aws appsync list-graphql-apis \
            --query 'graphqlApis[].{name:name,apiId:apiId,auth:authenticationType}' --output table

      - name: Live-Backend-Zuordnung pruefen
        # amplify_outputs.json ist bei einer Web-App oeffentliche Client-Konfiguration. Wir geben
        # die Datei trotzdem nicht komplett aus, sondern verwenden nur die IDs/URLs, um exakt den
        # von der live ausgelieferten Anwendung verwendeten Cognito-/AppSync-Stack nachzuweisen.
        if: ${{ !cancelled() }}
        env:
          BASE_URL: ${{ vars.AMPLIFY_BASE_URL }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          outputs=$(mktemp)
          trap 'rm -f "${outputs}"' EXIT

          curl -fsS --max-time 30 "${base}/amplify_outputs.json" -o "${outputs}"

          version=$(jq -er '.version | select(type == "string" and length > 0)' "${outputs}")
          user_pool_id=$(jq -er '.auth.user_pool_id | select(type == "string" and length > 0)' "${outputs}")
          user_pool_client_id=$(jq -er '.auth.user_pool_client_id | select(type == "string" and length > 0)' "${outputs}")
          auth_region=$(jq -er '.auth.aws_region | select(type == "string" and length > 0)' "${outputs}")
          unauthenticated=$(jq -r '.auth.unauthenticated_identities_enabled // false' "${outputs}")
          data_url=$(jq -er '.data.url | select(type == "string" and length > 0)' "${outputs}")
          data_region=$(jq -er '.data.aws_region | select(type == "string" and length > 0)' "${outputs}")
          data_auth=$(jq -er '.data.default_authorization_type | select(type == "string" and length > 0)' "${outputs}")

          if [ "${auth_region}" != "${AWS_REGION}" ] || [ "${data_region}" != "${AWS_REGION}" ]; then
            echo "::error::Live-Konfiguration zeigt auf Region auth=${auth_region}, data=${data_region}; erwartet ${AWS_REGION}."
            exit 1
          fi
          if [ "${unauthenticated}" != "false" ]; then
            echo "::error::Live-Konfiguration erlaubt unauthentifizierte Identitaeten."
            exit 1
          fi
          if [ "${data_auth}" != "AMAZON_COGNITO_USER_POOLS" ]; then
            echo "::error::Unerwartete AppSync-Standardautorisierung: ${data_auth}."
            exit 1
          fi

          pool_name=$(aws cognito-idp describe-user-pool \
            --user-pool-id "${user_pool_id}" --query 'UserPool.Name' --output text)
          client_name=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "${user_pool_id}" --client-id "${user_pool_client_id}" \
            --query 'UserPoolClient.ClientName' --output text)

          # Die API wird ueber ihren Endpunkt aufgeloest, nicht aus dem Hostnamen abgeleitet: Der
          # DNS-Praefix des GraphQL-Endpunkts ist nicht zwingend die API-ID. Bei dieser App weichen
          # beide voneinander ab, weshalb get-graphql-api mit NotFoundException scheiterte.
          #
          # Der Endpunktvergleich ist dabei kein Ersatz, sondern die schaerfere Pruefung: Frueher
          # wurde die URL nachtraeglich verglichen, jetzt ist sie das Suchkriterium. Genau eine
          # API muss passen -- keine oder mehrere sind beides ein Fehler.
          #
          # list-graphql-apis paginiert die AWS CLI von sich aus vollstaendig (Paginator mit
          # result_key graphqlApis) und fuehrt die Seiten zusammen. Ein --max-items wuerde dieses
          # Ergebnis clientseitig abschneiden und genau die Luecke aufreissen, die es zu vermeiden
          # gilt -- deshalb bewusst ohne Begrenzung.
          api_match=$(aws appsync list-graphql-apis --output json |
            jq -er --arg url "${data_url}" '
              [.graphqlApis[] | select((.uris.GRAPHQL // "" | rtrimstr("/")) == ($url | rtrimstr("/")))]
              | if length == 1 then .[0] else empty end
            ') || {
            echo "::error::Keine eindeutige AppSync-API zum Endpunkt der Live-Outputs gefunden: ${data_url}"
            exit 1
          }
          IFS=$'\t' read -r api_id api_name api_auth \
            <<<"$(printf '%s' "${api_match}" | jq -er '[.apiId, .name, .authenticationType] | @tsv')"

          if [ "${api_auth}" != "${data_auth}" ]; then
            echo "::error::Live-Output und AWS widersprechen sich bei AppSync-Auth: output=${data_auth}, aws=${api_auth}."
            exit 1
          fi

          echo "Live-Backend eindeutig zugeordnet:"
          echo "  Outputs-Version: ${version}"
          echo "  Cognito: ${pool_name} / ${client_name} (${user_pool_id})"
          echo "  AppSync: ${api_name} (${api_id}) / ${api_auth}"
          {
            echo "### Live-Backend-Zuordnung"
            echo ""
            echo "- Amplify Outputs: \`${version}\`"
            echo "- Cognito User Pool: \`${pool_name}\` (\`${user_pool_id}\`)"
            echo "- Cognito App Client: \`${client_name}\`"
            echo "- AppSync: \`${api_name}\` (\`${api_id}\`)"
            echo "- Standard-Auth: \`${api_auth}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: SSR-Laufzeitlogs pruefen
        # Ein gruener Amplify-Build ist kein Nachweis fuer eine laufende SSR-Umgebung; genau diese
        # Luecke hatte den HTTP-500-Fall auf deploy verursacht (docs/19, Abschnitt 2).
        if: ${{ !cancelled() }}
        env:
          LOG_WINDOW: ${{ inputs.log_window }}
        run: |
          set -euo pipefail
          group="/aws/amplify/${{ vars.AMPLIFY_APP_ID }}"
          # Eine fehlgeschlagene AWS-Abfrage darf nicht wie eine fehlende Log-Gruppe aussehen:
          # in einer Bedingung loest ein Fehler der Kommandosubstitution kein set -e aus, das
          # Ergebnis waere schlicht leer. Deshalb Exitcode und Fehlertext getrennt auswerten.
          # Die Fehlerausgabe bleibt getrennt: eine Warnung der AWS CLI auf stderr wuerde sonst im
          # Ergebnis landen und den Vergleich verfaelschen. Gleiches Vorgehen wie run_aws in
          # scripts/amplify-deployment-status.sh.
          err_file=$(mktemp)
          if ! found=$(aws logs describe-log-groups --log-group-name-prefix "${group}" \
                         --query "logGroups[?logGroupName=='${group}'].logGroupName" \
                         --output text 2>"${err_file}"); then
            echo "::error::CloudWatch-Abfrage fehlgeschlagen: $(cat "${err_file}")"
            rm -f "${err_file}"
            exit 1
          fi
          rm -f "${err_file}"
          if [ -z "${found}" ]; then
            echo "Log-Gruppe ${group} existiert nicht - die Compute-Umgebung hat noch nichts geloggt."
            exit 0
          fi
          echo "== Letzte Ereignisse in ${group} (${LOG_WINDOW}) =="
          aws logs tail "${group}" --since "${LOG_WINDOW}" --format short | tail -n 100

      - name: Reale Anwendung aufrufen
        # Der einzige Schritt, der die Anwendung so sieht wie ein Nutzer. Er braucht kein AWS und
        # laeuft deshalb auch dann, wenn eine der Diagnosen zuvor fehlgeschlagen ist.
        if: ${{ !cancelled() }}
        env:
          BASE_URL: ${{ vars.AMPLIFY_BASE_URL }}
        run: |
          set -euo pipefail
          # Ein abschliessender Schraegstrich in der Variable ergaebe sonst eine doppelte Trennung.
          base="${BASE_URL%/}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${base}/")
          echo "GET ${base}/ -> ${code}"
          {
            echo "### Reale Anwendung"
            echo ""
            echo "\`GET ${base}/\` -> ${code}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${code}" != "200" ]; then
            echo "::error::Die deployte Anwendung antwortet mit HTTP ${code} statt 200."
            exit 1
          fi
