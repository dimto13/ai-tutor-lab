name: AITP-23 Format Fix

on:
  push:
    branches:
      - feat/aitp-23-terminal-simulator

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/aitp-23-terminal-simulator
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --install-strategy=nested
      - name: Format AITP-23 files
        run: npx prettier --write src/runtime/terminalCommandEngine.ts src/runtime/vscodeRuntime.ts tests/runtime/terminalCommandEngine.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/terminalCommandEngine.ts src/runtime/vscodeRuntime.ts tests/runtime/terminalCommandEngine.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format AITP-23 fixes"
          git push origin HEAD:feat/aitp-23-terminal-simulator
