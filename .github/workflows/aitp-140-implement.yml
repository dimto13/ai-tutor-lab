name: AITP-140 Implementation Patch

on:
  push:
    branches:
      - agent/aitp-140-copilot-modes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aitp-140-copilot-modes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --install-strategy=nested
      - run: python scripts/aitp-140-patch.py
      - run: |
          npx prettier --write \
            apps/web/src/runtime/copilotRuntime.ts \
            packages/training-engine/src/types.ts \
            apps/web/src/scenarios/contentLoader.ts \
            apps/web/src/state/trainingStore.tsx \
            apps/web/src/components/workspace/CopilotPanel.tsx \
            apps/web/src/scenarios/index.ts \
            apps/web/src/routes/index.tsx \
            content/scenarios/copilot-basics.guided.json \
            apps/web/e2e/tests/copilot-basics.spec.ts \
            apps/web/e2e/tests/copilot-modes.spec.ts \
            tests/runtime/copilotRuntime.contract.test.ts
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web packages content tests
          git commit -m "AITP-140: complete Copilot Explore Guided Challenge"
          git push
