name: PR Post-Rebase Fix

on:
  push:
    branches:
      - feat/aitp-139-source-control-platform-basics

permissions:
  contents: write

jobs:
  migrate-glossary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Assign AITP-139 glossary concepts to source-control technology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("content/glossary/de.json")
          data = json.loads(path.read_text())
          keys = [
              "platform.repository",
              "platform.branch_selector",
              "platform.commit_history",
              "platform.pull_request",
              "platform.diff",
              "platform.review",
              "platform.status_checks",
              "platform.issues",
              "platform.remote",
          ]
          target = data["technologyConcepts"]["source_control"]
          for key in keys:
              if key not in target:
                  target.append(key)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/glossary/de.json
          git commit -m "fix: assign platform glossary concepts to source control"
          git push
