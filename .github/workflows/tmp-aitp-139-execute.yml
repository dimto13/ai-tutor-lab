name: Temporary execute AITP-139 integration

on:
  push:
    branches:
      - feat/aitp-139-source-control-platform-basics

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/aitp-139-source-control-platform-basics

      - name: Execute integration patch specification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/tmp-aitp-139-merge-probe.yml').read_text().splitlines()
          marker = '        run: |'
          start = source.index(marker) + 1
          script_lines = []
          for line in source[start:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip() == '':
                  script_lines.append('')
              else:
                  break
          script = '\n'.join(script_lines) + '\n'
          prettier = 'npx prettier --write \\\n'
          if prettier not in script:
              raise SystemExit('Prettier anchor not found in integration specification')
          script = script.replace(prettier, 'npm ci\n' + prettier, 1)
          script = script.replace(
              'npm test -- e2e/tests/source-control-platform-basics.spec.ts --reporter=line\n',
              '',
              1,
          )
          script = script.replace('rm .github/workflows/tmp-aitp-139-merge-probe.yml\n', '', 1)
          Path('/tmp/run-aitp-139.sh').write_text(script)
          PY
          bash /tmp/run-aitp-139.sh
