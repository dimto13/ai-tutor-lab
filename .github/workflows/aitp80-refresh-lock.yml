name: AITP-80 regenerate merged npm lockfile

on:
  push:
    branches:
      - feature/aitp-80-remove-lovable-tooling

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/aitp-80-remove-lovable-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate and verify lockfile
        run: |
          rm -rf node_modules package-lock.json
          npm install --install-strategy=nested --ignore-scripts
          rm -rf node_modules
          npm ci --install-strategy=nested --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "AITP-80 regenerate merged npm lockfile"
          git push origin HEAD:feature/aitp-80-remove-lovable-tooling
