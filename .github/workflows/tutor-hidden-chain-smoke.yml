name: Tutor Hidden Chain Smoke

# Passive, zero-token diagnostics for the production tutor path. This workflow never deploys,
# invokes Lambda, sends SSM commands, or calls a model. The explicit real-request micro smoke lives
# in the already-established Cloud Acceptance workflow and remains default-OFF there.
on:
  workflow_dispatch:
    inputs:
      evidence_window_hours:
        description: "Look-back window for existing tutor evidence"
        required: false
        default: "24"

concurrency:
  group: tutor-hidden-chain-smoke
  cancel-in-progress: false

permissions:
  contents: read

env:
  TUTOR_MANAGED_NODE_ID: mi-0c4f95e235b575da9

jobs:
  passive-zero-token:
    name: Passive tutor path (0 token)
    runs-on: ubuntu-latest
    environment: cloud-acceptance
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Passive write/invoke guard
        run: |
          set -euo pipefail
          # Run this static guard before any AWS step. The IAM role is read-only as the primary
          # enforcement; this catches accidental write/invoke commands in the workflow itself.
          if grep -Eiq 'aws[[:space:]]+(ssm[[:space:]]+send-command|lambda[[:space:]]+invoke)' "${GITHUB_WORKSPACE}/.github/workflows/tutor-hidden-chain-smoke.yml"; then
            echo "::error::Passive smoke contains a forbidden AWS write/invoke command."
            exit 1
          fi

      - name: AWS account in logs maskieren
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          account=$(printf '%s' "${ROLE_ARN}" | cut -d: -f5)
          if [[ ! "${account}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ROLE_ARN has an unexpected account component."
            exit 1
          fi
          echo "::add-mask::${account}"

      - name: AWS-Anmeldung per OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ai-tutor-hidden-chain-smoke

      - name: Exact artifact and Amplify state
        env:
          GH_TOKEN: ${{ github.token }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          main_sha=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')
          deploy_sha=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/deploy --jq '.object.sha')
          job=$(aws amplify list-jobs --app-id "${AMPLIFY_APP_ID}" --branch-name "${AMPLIFY_BRANCH}" --max-results 1 --output json)
          job_id=$(jq -er '.jobSummaries[0].jobId' <<<"${job}")
          job_status=$(jq -er '.jobSummaries[0].status' <<<"${job}")
          job_commit=$(jq -er '.jobSummaries[0].commitId' <<<"${job}")
          {
            echo "### Exact artifact"
            echo "- main: \`${main_sha}\`"
            echo "- deploy: \`${deploy_sha}\`"
            echo "- Amplify job: \`${job_id}\` / \`${job_status}\` / commit \`${job_commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: SSM managed node is online
        run: |
          set -euo pipefail
          node="${TUTOR_MANAGED_NODE_ID}"
          info=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${node}" --output json)
          count=$(jq '.InstanceInformationList | length' <<<"${info}")
          if [ "${count}" -ne 1 ]; then
            echo "::error::Expected managed node is not registered."
            exit 1
          fi
          ping=$(jq -r '.InstanceInformationList[0].PingStatus' <<<"${info}")
          agent=$(jq -r '.InstanceInformationList[0].AgentVersion' <<<"${info}")
          if [ "${ping}" != "Online" ]; then
            echo "::error::Expected managed node is ${ping}, not Online."
            exit 1
          fi
          {
            echo "### SSM relay host"
            echo "- managed node: \`${node}\`"
            echo "- status: \`Online\`"
            echo "- SSM agent: \`${agent}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Existing SendCommand evidence (read-only)
        env:
          WINDOW_HOURS: ${{ inputs.evidence_window_hours }}
        run: |
          set -euo pipefail
          case "${WINDOW_HOURS}" in
            '' | *[!0-9]*) echo "::error::evidence_window_hours must be an integer."; exit 1 ;;
          esac
          start=$(date -u -d "${WINDOW_HOURS} hours ago" +%FT%TZ)
          events=$(aws cloudtrail lookup-events \
            --lookup-attributes AttributeKey=EventName,AttributeValue=SendCommand \
            --start-time "${start}" --max-items 500 --output json)
          node="${TUTOR_MANAGED_NODE_ID}"
          matches=$(jq --arg node "${node}" '[.Events[] | select(.CloudTrailEvent | contains($node))] | length' <<<"${events}")
          if [ "${matches}" -eq 0 ]; then
            echo "::notice::No recent SendCommand evidence for the tutor managed node. Infrastructure checks remain independent of traffic recency."
            echo "- recent tutor SendCommand evidence: \`none in window\`" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "- recent tutor SendCommand evidence: \`present (${matches})\`" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Tutor/relay and SSR log metadata is readable
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
        run: |
          set -euo pipefail
          ssr="/aws/amplify/${AMPLIFY_APP_ID}"
          ssr_count=$(aws logs describe-log-groups --log-group-name-prefix "${ssr}" \
            --query "length(logGroups[?logGroupName=='${ssr}'])" --output text)
          if [ "${ssr_count}" -ne 1 ]; then
            echo "::error::SSR log group is not readable/present."
            exit 1
          fi
          relay_prefix="/aws/lambda/amplify-${AMPLIFY_APP_ID}-"
          relay_groups=$(aws logs describe-log-groups --log-group-name-prefix "${relay_prefix}" --output json \
            | jq '[.logGroups[].logGroupName | select(test("tutorrelay"; "i"))] | length')
          {
            echo "### Log metadata"
            echo "- SSR log group: \`readable\`"
            echo "- tutor relay log groups visible: \`${relay_groups}\`"
            echo "- message bodies: \`not emitted\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Existing tutor evidence stays local-only (0 token)
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          WINDOW_HOURS: ${{ inputs.evidence_window_hours }}
        run: node scripts/verify-tutor-passive-evidence.mjs