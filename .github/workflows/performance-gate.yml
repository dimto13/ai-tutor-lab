name: Performance Gate (Baseline)

# Stage 1 for #562: production-build synthetic lab measurements. This is NOT
# field evidence, a finalized budget gate, or post-Amplify release acceptance.
# Run on every PR (no path-filtered required check left pending), main and daily.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: performance-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-artifact-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERF_BASE_URL: http://127.0.0.1:3000
      PERF_TARGET: local
      PERF_ARTIFACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AMPLIFY_COMPUTE_PORT: "3000"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PERF_ARTIFACT_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned runtime toolchain
        run: node scripts/check-runtime-versions.mjs --toolchain-only

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Build real production-mode Amplify compute artifact (local auth)
        env:
          VITE_AUTH_MODE: local
        run: npm run build

      - name: Verify Amplify compute runtime
        run: npm run validate:amplify-runtime

      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --prefix apps/web/e2e --package-lock=false --ignore-scripts --no-audit --no-fund
          ./apps/web/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Measure three cold samples per route/profile
        run: |
          set -euo pipefail
          compute_dir="apps/web/.amplify-hosting/compute/default"
          compute_log="${RUNNER_TEMP}/performance-compute.log"
          setsid sh -c 'cd "$1" && exec env HOST=127.0.0.1 PORT="$2" node server.js' \
            _ "${compute_dir}" "${AMPLIFY_COMPUTE_PORT}" >"${compute_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -- "-${server_pid}" 2>/dev/null || kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 "${PERF_BASE_URL}/" -o "${RUNNER_TEMP}/performance-root.html"; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${compute_log}"
              exit 1
            fi
            sleep 0.5
          done
          if [ "${ready}" != "true" ]; then
            cat "${compute_log}"
            echo "::error::Amplify compute artifact was not ready for performance measurements"
            exit 1
          fi

          # Stale local/runner samples must never be mistaken for this SHA.
          rm -rf apps/web/e2e/test-results-performance apps/web/e2e/playwright-report-performance
          ./apps/web/e2e/node_modules/.bin/playwright test \
            --config apps/web/e2e/performance/performance.config.ts
          node scripts/performance/report.mjs apps/web/e2e/test-results-performance

      - name: Archive SHA-bound synthetic traces and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline-${{ github.run_id }}
          path: |
            apps/web/e2e/test-results-performance
            apps/web/e2e/playwright-report-performance
            ${{ runner.temp }}/performance-compute.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain stage-1 acceptance boundary
        if: always()
        run: |
          {
            echo "### Synthetic performance baseline (#562)"
            echo ""
            echo "- Source/build SHA: \`${PERF_ARTIFACT_SHA}\`"
            echo "- Real production-mode compute artifact, local synthetic auth"
            echo "- Three cold runs per route/profile; traces attached if produced"
            echo "- Budgets: PENDING_PLAN_APPROVAL; no performance-regression PASS claimed"
            echo "- No real Cognito, managed enterprise device or cloud-release acceptance"
          } >> "${GITHUB_STEP_SUMMARY}"
