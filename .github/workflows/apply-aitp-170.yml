name: Apply AITP-170

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/aitp-170-persona-audit
          fetch-depth: 0

      - name: Apply persona and glossary audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          def set_audience(path, concepts):
              data = load(path)
              audience = data.setdefault("audience", {})
              audience["personaId"] = "non-programmer"
              existing = audience.get("glossaryConcepts", [])
              audience["glossaryConcepts"] = list(dict.fromkeys(existing + concepts))
              save(path, data)

          # Add the two missing beginner-facing glossary concepts.
          glossary_path = "content/glossary/de.json"
          glossary = load(glossary_path)
          concepts = glossary["concepts"]
          keys = {concept["key"] for concept in concepts}
          if "web.html" not in keys:
              concepts.append({
                  "key": "web.html",
                  "term": "HTML",
                  "aliases": ["HTML-Seite", "HTML-Dokument"],
                  "simple": "HTML beschreibt die Struktur und den Inhalt einer Webseite, ähnlich wie eine Dokumentvorlage festlegt, welche Überschriften, Texte, Listen oder Tabellen an welcher Stelle stehen.",
                  "advanced": "HTML ist eine Auszeichnungssprache. Elemente wie Überschriften, Absätze, Links und Tabellen werden mit strukturellen Tags beschrieben und vom Browser dargestellt.",
                  "uiTargets": []
              })
          if "vscode.shortcut" not in keys:
              concepts.append({
                  "key": "vscode.shortcut",
                  "term": "Shortcut",
                  "aliases": ["Tastenkürzel", "Keyboard Shortcut"],
                  "simple": "Ein Shortcut ist eine Tastenkombination, mit der du einen Befehl direkt ausführst, statt ihn über ein Menü anzuklicken – ähnlich wie Strg+C zum Kopieren in Office.",
                  "advanced": "VS Code ordnet Befehlen konfigurierbare Tastenkombinationen zu. Shortcuts beschleunigen wiederkehrende Aktionen, sind aber keine Voraussetzung, um die Funktion grundsätzlich zu verstehen.",
                  "uiTargets": []
              })
          tech = glossary.get("technologyConcepts", {})
          tech.setdefault("ide", [])
          if "vscode.shortcut" not in tech["ide"]:
              tech["ide"].append("vscode.shortcut")
          tech.setdefault("artifact_preview", [])
          if "web.html" not in tech["artifact_preview"]:
              tech["artifact_preview"].append("web.html")
          glossary["version"] = max(int(glossary.get("version", 1)), 5)
          save(glossary_path, glossary)

          # Scenarios that predate the audience contract now declare the same target persona.
          set_audience("content/scenarios/artifact-preview-foundation.guided.json", [
              "artifact.preview", "web.html"
          ])
          set_audience("content/scenarios/developer-workflow-basics.guided.json", [
              "foundation.code", "programming.python", "vscode.activity_bar", "vscode.explorer",
              "vscode.editor", "vscode.terminal", "git.repository", "git.stage", "git.commit",
              "github.copilot", "copilot.chat", "copilot.inline_suggestion"
          ])
          source_control = [
              "git.repository", "git.working_tree", "git.stage", "git.commit", "git.branch",
              "github.platform", "git.github_difference", "platform.repository",
              "platform.branch_selector", "platform.commit_history", "platform.pull_request",
              "platform.diff", "platform.review", "platform.status_checks", "platform.issues",
              "platform.remote"
          ]
          for path in [
              "content/scenarios/source-control-platform-basics.explore.json",
              "content/scenarios/source-control-platform-basics.guided.json",
              "content/scenarios/source-control-platform-basics.challenge.json",
          ]:
              set_audience(path, source_control)
          set_audience("content/scenarios/vscode-shortcuts.challenge.json", [
              "vscode.shortcut", "vscode.explorer", "vscode.editor", "vscode.folder"
          ])

          # Existing audience blocks get the concepts they actually expose in user-facing text.
          set_audience("content/scenarios/copilot-basics.guided.json", [
              "vscode.editor", "github.copilot", "copilot.chat", "copilot.mcp",
              "copilot.agent_skill"
          ])
          set_audience("content/scenarios/html-page-workflow.guided.json", [
              "web.html", "artifact.preview", "github.copilot", "copilot.chat"
          ])
          set_audience("content/scenarios/research-workflow.guided.json", [
              "github.copilot", "copilot.chat", "artifact.preview"
          ])

          # Technical foundation scenario: keep the runtime contract, but make user-facing language beginner-safe.
          path = "content/scenarios/artifact-preview-foundation.guided.json"
          scenario = load(path)
          scenario["title"] = "Ergebnisse prüfen – Vorschau und Überarbeitungen"
          scenario["description"] = "Lerne, unterschiedliche erzeugte Ergebnisse anzusehen, zwischen Vorschau und Quelltext zu wechseln, eine vorbereitete Überarbeitung zu übernehmen und das Ergebnis bewusst zu prüfen."
          by_id = {step["id"]: step for step in scenario["steps"]}
          by_id["select-html-artifact"]["description"] = "Die Ergebnisfläche kann unterschiedliche Ergebnisarten wie eine HTML-Seite, eine Tabelle oder strukturierte Daten anzeigen."
          by_id["select-html-artifact"]["why"] = "So kannst du mehrere erzeugte Ergebnisse in derselben Arbeitsfläche unterscheiden und gezielt auswählen."
          by_id["switch-to-source"]["description"] = "Eine HTML-Seite kann entweder als fertige Vorschau oder als zugrunde liegender HTML-Text betrachtet werden."
          by_id["switch-to-source"]["why"] = "Die Quelltextansicht zeigt nachvollziehbar, was erzeugt wurde, ohne dass du HTML selbst schreiben musst."
          by_id["apply-artifact-revision"]["description"] = "Eine vorbereitete Überarbeitung verändert das Ergebnis reproduzierbar und macht eine typische Iteration sichtbar."
          by_id["apply-artifact-revision"]["why"] = "So siehst du, wie sich ein Ergebnis nach einer gezielten Änderungsanforderung weiterentwickeln kann."
          by_id["verify-artifact"]["description"] = "Ein sichtbares Ergebnis ist zunächst nur ein Entwurf; die fachliche Prüfung bleibt eine eigene Nutzeraktion."
          save(path, scenario)

          # Extend persona-audit term coverage for the newly audited concepts.
          path = Path("scripts/validate-persona-audit.ts")
          text = path.read_text()
          insert_after = '  { pattern: /\\bWorkspace\\b/i, concepts: ["vscode.workspace"], label: "Workspace" },\n'
          addition = '''  { pattern: /\\bShortcuts?\\b/i, concepts: ["vscode.shortcut"], label: "Shortcut" },\n  { pattern: /\\bHTML\\b/i, concepts: ["web.html"], label: "HTML" },\n  { pattern: /\\bWorking Tree\\b/i, concepts: ["git.working_tree"], label: "Working Tree" },\n  { pattern: /\\bRemote\\b/i, concepts: ["platform.remote"], label: "Remote" },\n'''
          if addition not in text:
              if insert_after not in text:
                  raise SystemExit("persona validator insertion point not found")
              text = text.replace(insert_after, insert_after + addition, 1)
          github_rule = '''  {\n    pattern: /\\bGitHub\\b/i,\n    concepts: ["github.platform", "github.copilot"],\n    label: "GitHub",\n  },\n'''
          copilot_rule = '''  {\n    pattern: /\\bCopilot\\b/i,\n    concepts: ["github.copilot"],\n    label: "Copilot",\n  },\n'''
          marker = '  { pattern: /\\bPython\\b|\\.py\\b/i, concepts: ["programming.python"], label: "Python" },\n'
          if github_rule not in text:
              text = text.replace(marker, marker + github_rule + copilot_rule, 1)
          path.write_text(text)

          # Run persona audit during normal content validation.
          path = Path("package.json")
          package = json.loads(path.read_text())
          command = package["scripts"]["validate:content"]
          validator = "node --experimental-strip-types scripts/validate-persona-audit.ts"
          if validator not in command:
              package["scripts"]["validate:content"] = command + " && " + validator
          path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Write audit report
        shell: bash
        run: |
          cat > docs/17-persona-audit.md <<'EOF'
          # 17 — Persona-Audit der bestehenden Szenarien

          Stand: August 2026. Zielpersona für die vorhandenen Lernpfade ist `non-programmer`.

          Der Audit prüft vier Ebenen: deklarierte Zielpersona, Glossarabdeckung sichtbarer Fachbegriffe, didaktische Pflichtaktionen und bereits eingeführte Qualitätsregeln für Hilfen und Freitext.

          | Szenario | Audit-Ergebnis | Wesentliche Maßnahme |
          | --- | --- | --- |
          | `artifact-preview-foundation.guided` | konform | Persona ergänzt; HTML und Artefakt verknüpft; technische Runtime-/DOM-Sprache aus dem Nutzertext entfernt |
          | `copilot-basics.guided` | konform | Copilot-, Editor-, MCP- und Agent-Skill-Glossar vollständig verknüpft; Code wird vor Nutzung erklärt |
          | `developer-workflow-basics.guided` | konform | Persona ergänzt; VS Code, Git, Python und Copilot verknüpft; erster Code wird von Copilot erzeugt und geprüft |
          | `html-page-workflow.guided` | konform | HTML-, Artefakt- und Copilot-Begriffe ergänzt; eigener Prompt statt Magic Word |
          | `research-workflow.guided` | konform | Copilot-/Artefaktbezug ergänzt; freie Rechercheformulierung bleibt zulässig |
          | `source-control-platform-basics.explore` | konform | Persona und vollständiges Git-/Plattform-Glossar ergänzt |
          | `source-control-platform-basics.guided` | konform | Persona und Git-/Plattform-Glossar ergänzt; Review-Freitext tolerant |
          | `source-control-platform-basics.challenge` | konform | Persona und Git-/Plattform-Glossar ergänzt; Endzustand statt Magic Word bewertet |
          | `vscode-basics.explore` | konform | Audience-/Glossarmuster vorhanden; alle Hauptmenüs und UI-Grundbegriffe explorierbar |
          | `vscode-basics.guided` | konform | Grundbegriffe vorgeschaltet; einfacher `Open Folder`-Pflichtpfad; kein vorausgesetzter Programmcode |
          | `vscode-basics.challenge` | konform | bereits gelernte Begriffe vorausgesetzt; Textdatei statt Python-Aufgabe |
          | `vscode-shortcuts.challenge` | konform | Persona und Shortcut-Glossar ergänzt; reine Bedienaufgabe ohne Programmiersyntax |

          ## Verbindliche Regeln nach dem Audit

          1. Jedes Szenario unter `content/scenarios` deklariert eine Persona und mindestens einen Glossarbegriff.
          2. Zentrale sichtbare Fachbegriffe müssen im `audience.glossaryConcepts` des Szenarios verknüpft sein.
          3. `non-programmer` darf nicht ohne Erklärung zu Programmcode gezwungen werden. Wo Code Lerngegenstand ist, wird er erklärt oder von der KI erzeugt und anschließend geprüft.
          4. Fortgeschrittene Produktfunktionen bleiben im Anfängerpflichtpfad nur dann verpflichtend, wenn sie für das konkrete Lernziel notwendig sind.
          5. Hilfen eskalieren Orientierung → konkrete Aktion → maximale Hilfe.
          6. Freitext wird nicht durch Magic Words validiert, außer die exakte Textinformation ist selbst Lernziel.

          ## CI

          `scripts/validate-persona-audit.ts` verhindert künftig insbesondere Szenarien ohne Audience-Block, unbekannte Personas, unbekannte Glossarbegriffe sowie fehlende Glossarverknüpfungen für zentrale sichtbare Begriffe. Die bereits vorhandenen Validatoren für Hilfe-Eskalation und Freitext laufen im selben `validate:content`-Pfad.
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npx prettier --write .

      - name: Validate full audit
        run: npm run check

      - name: Commit audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "AITP-170: complete non-programmer scenario audit"
          git push origin HEAD:agent/aitp-170-persona-audit
