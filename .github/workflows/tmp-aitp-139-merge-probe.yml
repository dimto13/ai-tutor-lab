name: Temporary AITP-139 integration

on:
  push:
    branches:
      - feat/aitp-139-source-control-platform-basics

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/aitp-139-source-control-platform-basics

      - name: Merge current main and close AITP-139 review gaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != 'src/routes/training.$scenarioId.tsx' ]; then
              echo "Unexpected merge conflicts:"
              echo "$unresolved"
              exit 1
            fi
            git checkout --theirs -- 'src/routes/training.$scenarioId.tsx'
            git add 'src/routes/training.$scenarioId.tsx'
          fi

          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Preserve the responsive main route while delegating the primary runtime surface.
          replace_once(
              "src/routes/training.$scenarioId.tsx",
              'import { Workspace } from "@/components/workspace/Workspace";',
              'import { RuntimeWorkspace } from "@/components/workspace/RuntimeWorkspace";',
          )
          replace_once(
              "src/routes/training.$scenarioId.tsx",
              '<Workspace key={scenario.id} />',
              '<RuntimeWorkspace key={scenario.id} />',
          )

          # Catalog the new primary GitHub/source-control simulator introduced by this PR.
          catalog_path = Path("content/catalog/technology-catalog.json")
          catalog = json.loads(catalog_path.read_text())
          if not any(item["id"] == "source_control" for item in catalog["technologies"]):
              catalog["technologies"].append({"id": "source_control", "name": "Source Control"})
          if not any(item["id"] == "github" for item in catalog["products"]):
              catalog["products"].append({
                  "id": "github",
                  "providerId": "github",
                  "technologyId": "source_control",
                  "name": "GitHub",
              })
          if not any(item["id"] == "github@simulated-2026-08" for item in catalog["productVersions"]):
              catalog["productVersions"].append({
                  "id": "github@simulated-2026-08",
                  "productId": "github",
                  "version": "simulated-2026-08",
                  "capabilities": ["source_control"],
                  "runtimeAdapterIds": ["source-control-platform-simulator"],
              })
          if not any(item["id"] == "source-control-platform-simulator" for item in catalog["runtimeAdapters"]):
              catalog["runtimeAdapters"].append({
                  "id": "source-control-platform-simulator",
                  "productId": "github",
                  "kind": "simulator",
                  "capabilities": ["source_control"],
              })
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n")

          # Scenario-authored repository/review content. React only renders runtime state.
          repository_seed = {
              "repositoryFiles": ["docs/", "src/", "README.md", "CONTRIBUTING.md"],
              "commitHistory": [
                  ["a1b2c3d", "Dokumentation für neue Teammitglieder vorbereiten", "Maria Schmidt"],
                  ["9f8e7d6", "Beispiele für lokale Einrichtung ergänzen", "Jonas Weber"],
                  ["4c3b2a1", "Projektstruktur initialisieren", "Maria Schmidt"],
              ],
              "latestCommitRelativeTime": "vor 2 Stunden",
              "diffFilePath": "README.md",
              "diffContextOldLine": "8",
              "diffContextNewLine": "8",
              "diffContextText": "## Projekt lokal starten",
              "diffAddedNewLine": "9",
              "diffAddedText": "+ Folge der geprüften Einrichtung in docs/setup.md.",
              "reviewAuthor": "Jonas Weber",
              "reviewBody": "Bitte bestätige, dass der neue Einstieg keine internen Zugangsdaten enthält und der Link zur Einrichtung geprüft wurde.",
          }
          scenario_paths = [
              Path("content/scenarios/source-control-platform-basics.explore.json"),
              Path("content/scenarios/source-control-platform-basics.guided.json"),
              Path("content/scenarios/source-control-platform-basics.challenge.json"),
          ]
          for path in scenario_paths:
              scenario = json.loads(path.read_text())
              scenario["environment"]["seed"].update(repository_seed)
              if path.name.endswith("guided.json"):
                  step = next(item for item in scenario["steps"] if item["id"] == "create-pull-request")
                  step["validation"].setdefault("match", {})["title"] = "README um Einstieg ergänzen"
              path.write_text(json.dumps(scenario, ensure_ascii=False, indent=2) + "\n")

          runtime = Path("src/runtime/sourceControlPlatformRuntime.ts")
          text = runtime.read_text()
          old = '''  repositoryName: string;\n  activeView: PlatformView;'''
          new = '''  repositoryName: string;\n  repositoryFiles: string[];\n  commitHistory: Array<[string, string, string]>;\n  latestCommitRelativeTime: string;\n  diffFilePath: string;\n  diffContextOldLine: string;\n  diffContextNewLine: string;\n  diffContextText: string;\n  diffAddedNewLine: string;\n  diffAddedText: string;\n  reviewAuthor: string;\n  reviewBody: string;\n  activeView: PlatformView;'''
          if old not in text: raise SystemExit("runtime state interface anchor missing")
          text = text.replace(old, new, 1)

          old = '''  repositoryName: "onboarding-guide",\n  activeView: "overview",'''
          new = '''  repositoryName: "onboarding-guide",\n  repositoryFiles: ["docs/", "src/", "README.md", "CONTRIBUTING.md"],\n  commitHistory: [\n    ["a1b2c3d", "Dokumentation für neue Teammitglieder vorbereiten", "Maria Schmidt"],\n    ["9f8e7d6", "Beispiele für lokale Einrichtung ergänzen", "Jonas Weber"],\n    ["4c3b2a1", "Projektstruktur initialisieren", "Maria Schmidt"],\n  ],\n  latestCommitRelativeTime: "vor 2 Stunden",\n  diffFilePath: "README.md",\n  diffContextOldLine: "8",\n  diffContextNewLine: "8",\n  diffContextText: "## Projekt lokal starten",\n  diffAddedNewLine: "9",\n  diffAddedText: "+ Folge der geprüften Einrichtung in docs/setup.md.",\n  reviewAuthor: "Jonas Weber",\n  reviewBody:\n    "Bitte bestätige, dass der neue Einstieg keine internen Zugangsdaten enthält und der Link zur Einrichtung geprüft wurde.",\n  activeView: "overview",'''
          if old not in text: raise SystemExit("runtime initial state anchor missing")
          text = text.replace(old, new, 1)

          old = '''  return { ...value, branches: [...value.branches] };'''
          new = '''  return {\n    ...value,\n    branches: [...value.branches],\n    repositoryFiles: [...value.repositoryFiles],\n    commitHistory: value.commitHistory.map(\n      ([hash, message, author]) => [hash, message, author] as [string, string, string],\n    ),\n  };'''
          if old not in text: raise SystemExit("cloneState anchor missing")
          text = text.replace(old, new, 1)

          marker = '''function booleanFromSeed(seed: RuntimeSeed, key: string, fallback: boolean): boolean {'''
          helper = '''function commitHistoryFromSeed(\n  seed: RuntimeSeed,\n  key: string,\n  fallback: Array<[string, string, string]>,\n): Array<[string, string, string]> {\n  if (!hasOwn(seed, key)) {\n    return fallback.map(([hash, message, author]) => [hash, message, author]);\n  }\n  const value = seed[key];\n  if (\n    !Array.isArray(value) ||\n    !value.every(\n      (item) =>\n        Array.isArray(item) &&\n        item.length === 3 &&\n        item.every((part) => typeof part === "string"),\n    )\n  ) {\n    throw new TypeError(`Invalid source-control platform runtime seed field: ${key}`);\n  }\n  return value.map(\n    (item) => [item[0], item[1], item[2]] as [string, string, string],\n  );\n}\n\n'''
          if marker not in text: raise SystemExit("seed helper anchor missing")
          text = text.replace(marker, helper + marker, 1)

          old = '''    repositoryName: stringFromSeed(seed, "repositoryName", base.repositoryName),\n    currentBranch,'''
          new = '''    repositoryName: stringFromSeed(seed, "repositoryName", base.repositoryName),\n    repositoryFiles: stringArrayFromSeed(seed, "repositoryFiles", base.repositoryFiles),\n    commitHistory: commitHistoryFromSeed(seed, "commitHistory", base.commitHistory),\n    latestCommitRelativeTime: stringFromSeed(\n      seed,\n      "latestCommitRelativeTime",\n      base.latestCommitRelativeTime,\n    ),\n    diffFilePath: stringFromSeed(seed, "diffFilePath", base.diffFilePath),\n    diffContextOldLine: stringFromSeed(seed, "diffContextOldLine", base.diffContextOldLine),\n    diffContextNewLine: stringFromSeed(seed, "diffContextNewLine", base.diffContextNewLine),\n    diffContextText: stringFromSeed(seed, "diffContextText", base.diffContextText),\n    diffAddedNewLine: stringFromSeed(seed, "diffAddedNewLine", base.diffAddedNewLine),\n    diffAddedText: stringFromSeed(seed, "diffAddedText", base.diffAddedText),\n    reviewAuthor: stringFromSeed(seed, "reviewAuthor", base.reviewAuthor),\n    reviewBody: stringFromSeed(seed, "reviewBody", base.reviewBody),\n    currentBranch,'''
          if old not in text: raise SystemExit("stateFromSeed anchor missing")
          text = text.replace(old, new, 1)

          old = '''    typeof candidate.repositoryName === "string" &&\n    (candidate.activeView === "overview" ||'''
          new = '''    typeof candidate.repositoryName === "string" &&\n    Array.isArray(candidate.repositoryFiles) &&\n    candidate.repositoryFiles.every((file) => typeof file === "string") &&\n    Array.isArray(candidate.commitHistory) &&\n    candidate.commitHistory.every(\n      (commit) =>\n        Array.isArray(commit) &&\n        commit.length === 3 &&\n        commit.every((part) => typeof part === "string"),\n    ) &&\n    typeof candidate.latestCommitRelativeTime === "string" &&\n    typeof candidate.diffFilePath === "string" &&\n    typeof candidate.diffContextOldLine === "string" &&\n    typeof candidate.diffContextNewLine === "string" &&\n    typeof candidate.diffContextText === "string" &&\n    typeof candidate.diffAddedNewLine === "string" &&\n    typeof candidate.diffAddedText === "string" &&\n    typeof candidate.reviewAuthor === "string" &&\n    typeof candidate.reviewBody === "string" &&\n    (candidate.activeView === "overview" ||'''
          if old not in text: raise SystemExit("snapshot validation anchor missing")
          text = text.replace(old, new, 1)
          runtime.write_text(text)

          workspace = Path("src/components/workspace/SourceControlPlatformWorkspace.tsx")
          text = workspace.read_text()
          old = '''  repositoryName: "onboarding-guide",\n  activeView: "overview",'''
          new = '''  repositoryName: "onboarding-guide",\n  repositoryFiles: ["docs/", "src/", "README.md", "CONTRIBUTING.md"],\n  commitHistory: [\n    ["a1b2c3d", "Dokumentation für neue Teammitglieder vorbereiten", "Maria Schmidt"],\n    ["9f8e7d6", "Beispiele für lokale Einrichtung ergänzen", "Jonas Weber"],\n    ["4c3b2a1", "Projektstruktur initialisieren", "Maria Schmidt"],\n  ],\n  latestCommitRelativeTime: "vor 2 Stunden",\n  diffFilePath: "README.md",\n  diffContextOldLine: "8",\n  diffContextNewLine: "8",\n  diffContextText: "## Projekt lokal starten",\n  diffAddedNewLine: "9",\n  diffAddedText: "+ Folge der geprüften Einrichtung in docs/setup.md.",\n  reviewAuthor: "Jonas Weber",\n  reviewBody:\n    "Bitte bestätige, dass der neue Einstieg keine internen Zugangsdaten enthält und der Link zur Einrichtung geprüft wurde.",\n  activeView: "overview",'''
          if old not in text: raise SystemExit("workspace empty state anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace('<CommitsView />', '<CommitsView state={state} />', 1)
          text = text.replace('{tab === "diff" ? <DiffView /> : null}', '{tab === "diff" ? <DiffView state={state} /> : null}', 1)

          old = '''function CommitsView() {\n  const commits = [\n    ["a1b2c3d", "Dokumentation für neue Teammitglieder vorbereiten", "Maria Schmidt"],\n    ["9f8e7d6", "Beispiele für lokale Einrichtung ergänzen", "Jonas Weber"],\n    ["4c3b2a1", "Projektstruktur initialisieren", "Maria Schmidt"],\n  ];'''
          new = '''function CommitsView({ state }: { state: SourceControlPlatformState }) {\n  const commits = state.commitHistory;'''
          if old not in text: raise SystemExit("CommitsView anchor missing")
          text = text.replace(old, new, 1)

          old = '''function CodeView({\n  state,\n  newBranch,\n  setNewBranch,\n  inspect,\n}: {\n  state: SourceControlPlatformState;\n  newBranch: string;\n  setNewBranch(value: string): void;\n  inspect(ref: string): void;\n}) {\n  return ('''
          new = '''function CodeView({\n  state,\n  newBranch,\n  setNewBranch,\n  inspect,\n}: {\n  state: SourceControlPlatformState;\n  newBranch: string;\n  setNewBranch(value: string): void;\n  inspect(ref: string): void;\n}) {\n  const latestCommit = state.commitHistory[0];\n  return ('''
          if old not in text: raise SystemExit("CodeView anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '<span className="font-medium">Dokumentation für neue Teammitglieder vorbereiten</span>',
              '<span className="font-medium">{latestCommit?.[1] ?? ""}</span>',
              1,
          )
          text = text.replace(
              '<span className="ml-auto text-muted-foreground">a1b2c3d · vor 2 Stunden</span>',
              '<span className="ml-auto text-muted-foreground">{latestCommit?.[0] ?? ""} · {state.latestCommitRelativeTime}</span>',
              1,
          )
          text = text.replace(
              '{["docs/", "src/", "README.md", "CONTRIBUTING.md"].map((file) => (',
              '{state.repositoryFiles.map((file) => (',
              1,
          )
          text = text.replace('Änderungen angefragt · Jonas Weber', 'Änderungen angefragt · {state.reviewAuthor}', 1)
          old_review = '''                Bitte bestätige, dass der neue Einstieg keine internen Zugangsdaten enthält und der\n                Link zur Einrichtung geprüft wurde.'''
          if old_review not in text: raise SystemExit("review body anchor missing")
          text = text.replace(old_review, '                {state.reviewBody}', 1)

          text = text.replace('function DiffView() {', 'function DiffView({ state }: { state: SourceControlPlatformState }) {', 1)
          text = text.replace('<FileDiff className="h-4 w-4 text-accent" /> README.md', '<FileDiff className="h-4 w-4 text-accent" /> {state.diffFilePath}', 1)
          text = text.replace('<span className="border-r border-border px-2 py-1 text-right">8</span>', '<span className="border-r border-border px-2 py-1 text-right">{state.diffContextOldLine}</span>', 1)
          text = text.replace('<span className="border-r border-border px-2 py-1 text-right">8</span>', '<span className="border-r border-border px-2 py-1 text-right">{state.diffContextNewLine}</span>', 1)
          text = text.replace('<span className="px-3 py-1">## Projekt lokal starten</span>', '<span className="px-3 py-1">{state.diffContextText}</span>', 1)
          text = text.replace('<span className="border-r border-success/20 px-2 py-1 text-right">9</span>', '<span className="border-r border-success/20 px-2 py-1 text-right">{state.diffAddedNewLine}</span>', 1)
          text = text.replace('<span className="px-3 py-1">+ Folge der geprüften Einrichtung in docs/setup.md.</span>', '<span className="px-3 py-1">{state.diffAddedText}</span>', 1)
          workspace.write_text(text)

          # Explore progress is inspection-only and must survive when no runtime snapshot exists.
          replace_once(
              "src/state/trainingStore.tsx",
              '      if (hasStarted) {',
              '      if (mode !== "explore" && hasStarted) {',
          )
          replace_once(
              "src/state/trainingStore.tsx",
              '    [scenario, scenarioRuntimes],\n  );',
              '    [mode, scenario, scenarioRuntimes],\n  );',
          )

          # E2E regressions: inspect-only Explore resume and title contract.
          e2e = Path("e2e/tests/source-control-platform-basics.spec.ts")
          text = e2e.read_text()
          guided_marker = 'test("Guided: kompletter Pull-Request- und Review-Ablauf entsteht durch Aktionen"'
          explore_resume = '''test("Explore: inspizierter Fortschritt bleibt ohne Runtime-Snapshot erhalten", async ({ page }) => {\n  await page.goto("/training/source-control-platform-basics.explore");\n  await waitForTrainingReady(page);\n  await page.getByRole("button", { name: /contoso-labs.*onboarding-guide/ }).click();\n  await expect(page.getByText("1 von 11 Oberflächen untersucht", { exact: true })).toBeVisible();\n\n  await page.goto("/");\n  await page.goto("/training/source-control-platform-basics.explore");\n  await waitForTrainingReady(page);\n  await expect(page.getByText("1 von 11 Oberflächen untersucht", { exact: true })).toBeVisible();\n});\n\n'''
          if guided_marker not in text: raise SystemExit("guided E2E marker missing")
          text = text.replace(guided_marker, explore_resume + guided_marker, 1)

          old = '''  await page\n    .getByRole("textbox", { name: "Pull-Request-Beschreibung" })\n    .fill("Einrichtung geprüft; keine Zugangsdaten enthalten.");\n  await page.getByRole("button", { name: "Änderungen speichern", exact: true }).click();\n  await expectGuidedStep(page, 6, "Tatsächlichen Diff prüfen");'''
          new = '''  await page.getByRole("textbox", { name: "Pull-Request-Titel" }).fill("");\n  await page\n    .getByRole("textbox", { name: "Pull-Request-Beschreibung" })\n    .fill("Einrichtung geprüft; keine Zugangsdaten enthalten.");\n  await page.getByRole("button", { name: "Änderungen speichern", exact: true }).click();\n  await expectGuidedStep(page, 5, "Pull Request nachvollziehbar beschreiben");\n  await page.getByRole("button", { name: "Pull Request bearbeiten", exact: true }).click();\n  await page\n    .getByRole("textbox", { name: "Pull-Request-Titel" })\n    .fill("README um Einstieg ergänzen");\n  await page.getByRole("button", { name: "Änderungen speichern", exact: true }).click();\n  await expectGuidedStep(page, 6, "Tatsächlichen Diff prüfen");'''
          if old not in text: raise SystemExit("guided title E2E anchor missing")
          text = text.replace(old, new, 1)
          e2e.write_text(text)

          # Runtime contract proves authored content is consumed by the runtime state.
          tests = Path("tests/runtime/sourceControlPlatformRuntime.contract.test.ts")
          text = tests.read_text()
          marker = 'test("sourceControlPlatformRuntime: computes merge readiness from final state, independent of action order"'
          authored_test = '''test("sourceControlPlatformRuntime: exposes scenario-authored repository and review content", async () => {\n  await sourceControlPlatformRuntime.mount(createContainer(), {\n    repositoryFiles: ["TRAINING.md"],\n    commitHistory: [["abc1234", "Szenarioinhalt", "Ada"]],\n    latestCommitRelativeTime: "gerade eben",\n    diffFilePath: "TRAINING.md",\n    diffContextOldLine: "1",\n    diffContextNewLine: "1",\n    diffContextText: "# Alt",\n    diffAddedNewLine: "2",\n    diffAddedText: "+ Neu",\n    reviewAuthor: "Reviewer",\n    reviewBody: "Bitte prüfen.",\n  });\n  try {\n    const snapshot = (await sourceControlPlatformRuntime.snapshot()) as SourceControlPlatformState;\n    assert.deepEqual(snapshot.repositoryFiles, ["TRAINING.md"]);\n    assert.deepEqual(snapshot.commitHistory, [["abc1234", "Szenarioinhalt", "Ada"]]);\n    assert.equal(snapshot.diffFilePath, "TRAINING.md");\n    assert.equal(snapshot.reviewAuthor, "Reviewer");\n    assert.equal(snapshot.reviewBody, "Bitte prüfen.");\n  } finally {\n    await sourceControlPlatformRuntime.unmount();\n  }\n});\n\n'''
          if marker not in text: raise SystemExit("runtime contract marker missing")
          text = text.replace(marker, authored_test + marker, 1)
          tests.write_text(text)
          PY

          npx prettier --write \
            content/catalog/technology-catalog.json \
            content/scenarios/source-control-platform-basics.*.json \
            'src/routes/training.$scenarioId.tsx' \
            src/runtime/sourceControlPlatformRuntime.ts \
            src/components/workspace/SourceControlPlatformWorkspace.tsx \
            src/state/trainingStore.tsx \
            e2e/tests/source-control-platform-basics.spec.ts \
            tests/runtime/sourceControlPlatformRuntime.contract.test.ts

          npm run check
          npm test -- e2e/tests/source-control-platform-basics.spec.ts --reporter=line

          rm .github/workflows/tmp-aitp-139-merge-probe.yml
          git add -A
          git commit -m "fix: integrate source-control training contracts"
          git push origin HEAD:feat/aitp-139-source-control-platform-basics
