name: Backlog generieren

on:
  push:
    branches: [main]
    paths: ['backlog/backlog.yaml', 'scripts/generate_backlog.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Backlog validieren und generieren
        run: python3 scripts/generate_backlog.py
      - name: Generierte Dateien committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/06-backlog.md backlog/tickets.csv
          git diff --cached --quiet && echo "Nichts zu tun" && exit 0
          git commit -m "chore: Backlog-Dateien regeneriert [skip ci]"
          git push
