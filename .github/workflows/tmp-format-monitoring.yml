name: Temporary Monitoring Format Capture

on:
  push:
    branches:
      - feat/platform-monitoring-script

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format monitoring script
        run: npx prettier --write scripts/extract-platform-monitoring.mjs

      - name: Upload formatted script
        uses: actions/upload-artifact@v7
        with:
          name: formatted-monitoring-script
          path: scripts/extract-platform-monitoring.mjs
          retention-days: 1
