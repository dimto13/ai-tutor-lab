name: Code CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Verify Lovable tooling is absent
        run: |
          if grep -E "@lovable\.dev/" package.json package-lock.json apps/web/package.json apps/web/vite.config.ts; then
            echo "Legacy Lovable build dependency detected."
            exit 1
          fi

      - name: Check formatting
        run: |
          npx prettier --write . >/dev/null
          if ! git diff --quiet; then
            while IFS= read -r file; do
              patch=$(git diff -- "$file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error file=$file::Prettier formatting required%0A$patch"
            done < <(git diff --name-only)
            exit 1
          fi

      - name: Validate scenario content
        run: npm run validate:content

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Package boundary tests
        run: npm run test:packages

      - name: Technology catalog tests
        run: npm run test:catalog

      - name: Runtime adapter contract tests
        run: npm run test:runtime-contracts

      - name: Architecture boundary tests
        run: npm run test:architecture

      - name: Build
        run: npm run build

      - name: Amplify compute runtime smoke
        run: npm run validate:amplify-runtime

  e2e-training-modes:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --prefix apps/web/e2e --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: ./apps/web/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run training-mode smoke tests
        shell: bash
        env:
          DEBUG: pw:webserver
        run: |
          set -o pipefail
          npm test --prefix apps/web/e2e 2>&1 | tee apps/web/e2e/e2e-ci.log

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
            apps/web/e2e/e2e-ci.log
          if-no-files-found: ignore
          retention-days: 7
