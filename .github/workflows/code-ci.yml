name: Code CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --install-strategy=nested

      - name: Verify Lovable tooling is absent
        run: |
          if grep -E "@lovable\.dev/" package.json package-lock.json vite.config.ts; then
            echo "Legacy Lovable build dependency detected."
            exit 1
          fi

      - name: Validate scenario content
        run: npm run validate:content

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime adapter contract tests
        run: npm run test:runtime-contracts

      - name: Build
        run: npm run build

  e2e-training-modes:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --install-strategy=nested

      - name: Install pinned Playwright test runner
        run: npm install --prefix e2e --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: ./e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run training-mode smoke tests
        run: npm test --prefix e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
