name: Code CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned runtime toolchain
        run: node scripts/check-runtime-versions.mjs --toolchain-only

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Verify beta runtime dependency contract
        run: |
          npm run check:runtime-versions
          npm ls react react-dom vite

      - name: Verify Lovable tooling is absent
        run: |
          if grep -E "@lovable\.dev/" package.json package-lock.json apps/web/package.json apps/web/vite.config.ts; then
            echo "Legacy Lovable build dependency detected."
            exit 1
          fi

      - name: Check formatting
        run: |
          npx prettier --write . >/dev/null
          if ! git diff --quiet; then
            while IFS= read -r file; do
              patch=$(git diff -- "$file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error file=$file::Prettier formatting required%0A$patch"
            done < <(git diff --name-only)
            exit 1
          fi

      - name: Validate scenario content
        run: npm run validate:content

      - name: Validate Attestation AppSync runtime
        run: npm run validate:attestation-appsync

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Amplify Data schema
        run: npm run validate:amplify-schema

      - name: Package boundary tests
        run: npm run test:packages

      - name: Technology catalog tests
        run: npm run test:catalog

      - name: Runtime adapter contract tests
        run: npm run test:runtime-contracts

      - name: Architecture boundary tests
        run: npm run test:architecture

      - name: Amplify CloudFormation graph smoke
        run: npm run validate:amplify-cloudformation-graph

      - name: Amplify function bundle smoke
        run: npm run validate:amplify-function-bundles

      - name: Build
        run: npm run build

      - name: Amplify compute runtime smoke
        run: npm run validate:amplify-runtime

      - name: Smoke local SSR runtime
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/dev-local.log"
          setsid npm run dev:local >"${log}" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -- "-${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3001/ -o "${RUNNER_TEMP}/root.html"; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${log}"
              exit 1
            fi
            sleep 1
          done

          if [ "${ready}" != "true" ]; then
            cat "${log}"
            echo "Local dev server did not become ready."
            exit 1
          fi

          curl -fsS --max-time 10 \
            http://127.0.0.1:3001/training/vscode-basics.guided \
            -o "${RUNNER_TEMP}/guided.html"
          grep -Eiq '<!doctype html|<html' "${RUNNER_TEMP}/root.html"
          grep -Eiq '<!doctype html|<html' "${RUNNER_TEMP}/guided.html"

          if grep -Eiq \
            'Invalid hook call|Cannot read properties of null.*use(State|Context|Effect|Memo|Ref)' \
            "${log}"; then
            cat "${log}"
            echo "Known React SSR runtime error detected."
            exit 1
          fi

          echo "dev:local SSR smoke OK: / and /training/vscode-basics.guided -> HTTP 200"

  e2e-training-modes:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned runtime toolchain
        run: node scripts/check-runtime-versions.mjs --toolchain-only

      - name: Install application dependencies
        run: npm ci

      - name: Verify beta runtime dependency contract
        run: npm run check:runtime-versions

      - name: Install pinned Playwright test runner
        run: npm install --prefix apps/web/e2e --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Typecheck cloud acceptance suite
        run: npx tsc --noEmit -p apps/web/e2e/tsconfig.cloud.json

      - name: Install Chromium
        run: ./apps/web/e2e/node_modules/.bin/playwright install chromium

      - name: Run training-mode smoke tests
        run: npm test --prefix apps/web/e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-production-artifact:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The generated Amplify Hosting compute wrapper currently binds to port 3000;
      # this is the same origin contract exercised by scripts/smoke-amplify-runtime.mjs.
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      AMPLIFY_COMPUTE_PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned runtime toolchain
        run: node scripts/check-runtime-versions.mjs --toolchain-only

      - name: Install application dependencies
        run: npm ci

      - name: Verify beta runtime dependency contract
        run: npm run check:runtime-versions

      - name: Build Amplify production artifact
        env:
          # Amplify Hosting normally runs `ampx pipeline-deploy` first and writes
          # Cognito outputs into apps/web/public. #309 intentionally has no cloud
          # credentials, so use the application's supported local auth adapter
          # while still producing the real production-mode Nitro/Amplify artifact.
          VITE_AUTH_MODE: local
        run: npm run build

      - name: Verify Amplify compute HTTP runtime
        run: npm run validate:amplify-runtime

      - name: Install pinned Playwright test runner
        run: npm install --prefix apps/web/e2e --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: ./apps/web/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run critical E2E against Amplify compute artifact
        run: |
          set -euo pipefail
          compute_dir="apps/web/.amplify-hosting/compute/default"
          compute_log="${RUNNER_TEMP}/amplify-compute-production-artifact.log"

          setsid sh -c 'cd "$1" && exec env HOST=127.0.0.1 PORT="$2" node server.js' \
            _ "${compute_dir}" "${AMPLIFY_COMPUTE_PORT}" >"${compute_log}" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -- "-${server_pid}" 2>/dev/null || kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 "${PLAYWRIGHT_BASE_URL}/" -o "${RUNNER_TEMP}/production-artifact-root.html"; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${compute_log}"
              echo "Amplify compute server exited before browser E2E readiness."
              exit 1
            fi
            sleep 0.5
          done

          if [ "${ready}" != "true" ]; then
            cat "${compute_log}"
            echo "Amplify compute server did not become ready at ${PLAYWRIGHT_BASE_URL}."
            exit 1
          fi

          echo "Amplify compute artifact ready at ${PLAYWRIGHT_BASE_URL}; running critical production subset."
          npm test --prefix apps/web/e2e -- --config=playwright.production-artifact.config.ts

      - name: Upload production-artifact Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-production-artifact-diagnostics
          path: |
            apps/web/e2e/playwright-report-production-artifact
            apps/web/e2e/test-results-production-artifact
            ${{ runner.temp }}/amplify-compute-production-artifact.log
          if-no-files-found: ignore
          retention-days: 7
