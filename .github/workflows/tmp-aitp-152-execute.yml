name: Temporary execute AITP-152 integration

on:
  push:
    branches:
      - feat/aitp-152-artifact-preview

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/aitp-152-artifact-preview

      - name: Execute corrected integration specification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/tmp-aitp-152-integrate.yml').read_text().splitlines()
          marker = '        run: |'
          start = source.index(marker) + 1
          script_lines = []
          for line in source[start:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip() == '':
                  script_lines.append('')
              else:
                  break
          script = '\n'.join(script_lines) + '\n'
          redundant = '''replace_once("src/runtime/runtimeAdapter.ts", '  | "agent_mode";', '  | "agent_mode"\\n  | "artifact_preview";')\n'''
          if redundant not in script:
              raise SystemExit('Expected already-applied RuntimeCapability patch not found')
          script = script.replace(redundant, '', 1)
          glossary_anchor = 'concepts = glossary["concepts"]\n'
          if glossary_anchor not in script:
              raise SystemExit('Glossary assignment anchor not found')
          script = script.replace(
              glossary_anchor,
              glossary_anchor + 'glossary["technologyConcepts"]["artifact_preview"] = ["artifact.preview"]\n',
              1,
          )
          validator_patch = '''python - <<'PY2'\nfrom pathlib import Path\nimport re\npath = Path("scripts/validate-content.ts")\ntext = path.read_text()\nif 'import { technologyCatalog } from "../src/catalog/index.ts";' not in text:\n    text = text.replace(\n        'import { z, ZodError } from "zod";\\n',\n        'import { z, ZodError } from "zod";\\nimport { technologyCatalog } from "../src/catalog/index.ts";\\n',\n        1,\n    )\ntext, count = re.subn(\n    r'const technologyIds = new Set\\(\\[.*?\\n\\]\\);',\n    'const technologyIds = new Set(technologyCatalog.technologies.map((technology) => technology.id));',\n    text,\n    count=1,\n    flags=re.S,\n)\nif count != 1:\n    raise SystemExit("technologyIds allowlist anchor not found")\npath.write_text(text)\n\ntest_path = Path("tests/catalog/technologyCatalog.test.ts")\ntest_text = test_path.read_text()\nold = '  assert.equal(technologyCatalog.providers.length, 3);\\n'\nnew = '  assert.ok(technologyCatalog.providers.some(({ id }) => id === "ai-train-lab"));\\n'\nif old not in test_text:\n    raise SystemExit("provider count assertion anchor not found")\ntest_path.write_text(test_text.replace(old, new, 1))\nPY2\nnpx prettier --write scripts/validate-content.ts tests/catalog/technologyCatalog.test.ts\n'''
          if 'npm ci\n' not in script:
              raise SystemExit('npm ci anchor not found')
          script = script.replace('npm ci\n', 'npm ci\n' + validator_patch, 1)
          Path('/tmp/run-aitp-152.sh').write_text(script)
          PY
          bash /tmp/run-aitp-152.sh
