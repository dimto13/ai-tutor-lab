name: Cloud User Acceptance

# Zustandsbasierte E2E-Abnahme gegen die reale Amplify-Anwendung.
#
# Dieser Workflow hat keinerlei AWS-IAM-Rechte. Er benutzt ausschliesslich dedizierte
# Cognito-Testkonten und die oeffentliche Web-App/AppSync-Grenze. Die Konten muessen vorab
# wie folgt provisioniert sein:
# - CLOUD_TEST_*: Primaernutzer in Tenant A
# - CLOUD_TEST_PEER_*: zweiter Nutzer in demselben Tenant A
# - CLOUD_TEST_OTHER_TENANT_*: Nutzer in Tenant B
# - CLOUD_TEST_PERSONAL_*: Nutzer ohne tenant:* Cognito-Gruppe
#
# Testdaten werden unter stabilen cloud-acceptance-* Scenario-IDs aktualisiert. Fuer den
# Scoring-Smoke wird die dedizierte Testidentitaet gegen vscode-shortcuts.challenge verwendet;
# die Score-Engine selbst stellt sicher, dass pro Nutzer/Scenario-Version hoechstens ein Award
# entstehen kann. Infrastruktur und Deployments werden nicht veraendert.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Cloud Acceptance"]
    types: [completed]
    branches: [main]

concurrency:
  group: cloud-user-acceptance
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  authenticated-user-e2e:
    name: Cognito + AppSync + Web UI
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: cloud-acceptance
    timeout-minutes: 20
    steps:
      - name: Exakte Cloud-Acceptance-Evidence laden
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          name: cloud-acceptance-evidence
          path: ${{ runner.temp }}/cloud-acceptance-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Abnahme-SHA bestimmen
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            evidence="${RUNNER_TEMP}/cloud-acceptance-evidence/cloud-acceptance-evidence.json"
            deploy_sha=$(jq -er '.deploySha | select(type == "string" and length == 40)' "${evidence}")
            source="chained"
          else
            deploy_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${DEPLOY_BRANCH}" | awk '{print $1}')
            source="manual-diagnostic"
          fi
          if [ -z "${deploy_sha}" ]; then
            echo "::error::Exakter deploy-SHA konnte nicht ermittelt werden."
            exit 1
          fi
          echo "deploy_sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"
          echo "acceptance_source=${source}" >> "${GITHUB_OUTPUT}"

      - name: Exakten deploy-Stand auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.deploy_sha }}

      - name: deploy-Ref vor UI-Abnahme pruefen
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.release.outputs.deploy_sha }}
          DEPLOY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          current=$(git ls-remote origin "refs/heads/${DEPLOY_BRANCH}" | awk '{print $1}')
          if [ "${current}" != "${EXPECTED_DEPLOY_SHA}" ]; then
            echo "::error::deploy wurde zwischen Cloud Acceptance und UI-Abnahme bewegt: erwartet ${EXPECTED_DEPLOY_SHA}, aktuell ${current}."
            exit 1
          fi

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Gepinnte Runtime-Toolchain pruefen
        run: node scripts/check-runtime-versions.mjs --toolchain-only

      - name: Testkonfiguration pruefen
        env:
          CLOUD_BASE_URL: ${{ vars.AMPLIFY_BASE_URL }}
          CLOUD_TEST_EMAIL: ${{ secrets.CLOUD_TEST_EMAIL }}
          CLOUD_TEST_PASSWORD: ${{ secrets.CLOUD_TEST_PASSWORD }}
          CLOUD_TEST_PEER_EMAIL: ${{ secrets.CLOUD_TEST_PEER_EMAIL }}
          CLOUD_TEST_PEER_PASSWORD: ${{ secrets.CLOUD_TEST_PEER_PASSWORD }}
          CLOUD_TEST_OTHER_TENANT_EMAIL: ${{ secrets.CLOUD_TEST_OTHER_TENANT_EMAIL }}
          CLOUD_TEST_OTHER_TENANT_PASSWORD: ${{ secrets.CLOUD_TEST_OTHER_TENANT_PASSWORD }}
          CLOUD_TEST_PERSONAL_EMAIL: ${{ secrets.CLOUD_TEST_PERSONAL_EMAIL }}
          CLOUD_TEST_PERSONAL_PASSWORD: ${{ secrets.CLOUD_TEST_PERSONAL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_BASE_URL}" ]; then
            echo "::error::Environment-Variable AMPLIFY_BASE_URL fehlt."
            exit 1
          fi
          for name in \
            CLOUD_TEST_EMAIL \
            CLOUD_TEST_PASSWORD \
            CLOUD_TEST_PEER_EMAIL \
            CLOUD_TEST_PEER_PASSWORD \
            CLOUD_TEST_OTHER_TENANT_EMAIL \
            CLOUD_TEST_OTHER_TENANT_PASSWORD \
            CLOUD_TEST_PERSONAL_EMAIL \
            CLOUD_TEST_PERSONAL_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Environment-Secret ${name} fehlt."
              exit 1
            fi
          done

      - name: Reale Client-Konfiguration pruefen
        env:
          CLOUD_BASE_URL: ${{ vars.AMPLIFY_BASE_URL }}
        run: |
          set -euo pipefail
          base="${CLOUD_BASE_URL%/}"
          curl -fsS --max-time 30 "${base}/" -o /dev/null
          curl -fsS --max-time 30 "${base}/amplify_outputs.json" \
            | jq -e '.auth.user_pool_id and .auth.user_pool_client_id and .data.url' >/dev/null

      - name: Playwright installieren
        run: npm install --prefix apps/web/e2e --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Chromium installieren
        run: ./apps/web/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Cognito- und AppSync-Abnahme ausfuehren
        env:
          CLOUD_BASE_URL: ${{ vars.AMPLIFY_BASE_URL }}
          CLOUD_TEST_EMAIL: ${{ secrets.CLOUD_TEST_EMAIL }}
          CLOUD_TEST_PASSWORD: ${{ secrets.CLOUD_TEST_PASSWORD }}
          CLOUD_TEST_PEER_EMAIL: ${{ secrets.CLOUD_TEST_PEER_EMAIL }}
          CLOUD_TEST_PEER_PASSWORD: ${{ secrets.CLOUD_TEST_PEER_PASSWORD }}
          CLOUD_TEST_OTHER_TENANT_EMAIL: ${{ secrets.CLOUD_TEST_OTHER_TENANT_EMAIL }}
          CLOUD_TEST_OTHER_TENANT_PASSWORD: ${{ secrets.CLOUD_TEST_OTHER_TENANT_PASSWORD }}
          CLOUD_TEST_PERSONAL_EMAIL: ${{ secrets.CLOUD_TEST_PERSONAL_EMAIL }}
          CLOUD_TEST_PERSONAL_PASSWORD: ${{ secrets.CLOUD_TEST_PERSONAL_PASSWORD }}
        run: |
          set -euo pipefail
          ./apps/web/e2e/node_modules/.bin/playwright test \
            --config apps/web/e2e/cloud.playwright.config.ts
          {
            echo "### Authentifizierte Cloud-Abnahme"
            echo ""
            echo "- Cognito Passwort-Login/Logout: bestanden"
            echo "- Profil/Praeferenz ueber AppSync + frischer Browserkontext: bestanden"
            echo "- TrainingSession + RuntimeSnapshot im frischen Browserkontext identisch: bestanden"
            echo "- Optimistic-Concurrency / stale revision wird abgewiesen: bestanden"
            echo "- Score-Award pro Scenario-Version idempotent: bestanden"
            echo "- Cross-User-Isolation im selben Tenant: bestanden"
            echo "- Cross-Tenant-Isolation: bestanden"
            echo "- personal:<sub>-Fallback ohne tenant:*-Gruppe: bestanden"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: deploy-Ref nach UI-Abnahme erneut pruefen
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.release.outputs.deploy_sha }}
          DEPLOY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
          ACCEPTANCE_SOURCE: ${{ steps.release.outputs.acceptance_source }}
        run: |
          set -euo pipefail
          current=$(git ls-remote origin "refs/heads/${DEPLOY_BRANCH}" | awk '{print $1}')
          if [ "${current}" != "${EXPECTED_DEPLOY_SHA}" ]; then
            echo "::error::deploy wurde waehrend der UI-Abnahme bewegt: erwartet ${EXPECTED_DEPLOY_SHA}, aktuell ${current}."
            exit 1
          fi
          {
            echo "### Abnahme-Artefakt"
            echo ""
            echo "- deploy SHA: \`${EXPECTED_DEPLOY_SHA}\`"
            echo "- Quelle: \`${ACCEPTANCE_SOURCE}\`"
            if [ "${ACCEPTANCE_SOURCE}" = "manual-diagnostic" ]; then
              echo "- Hinweis: manueller Lauf ist Diagnose; Release-Evidence entsteht aus der verketteten Cloud-Acceptance-Abnahme."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Screenshot bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-user-acceptance-screenshots
          path: apps/web/e2e/cloud-test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3
