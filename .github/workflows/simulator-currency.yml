name: Simulator Currency

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/simulator-currency.json"
      - ".github/workflows/simulator-currency.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: simulator-currency
  cancel-in-progress: false

jobs:
  sync-review-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned runtime toolchain
        run: node scripts/check-runtime-versions.mjs --toolchain-only

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Validate policy and synchronize due work
        run: node --experimental-strip-types scripts/check-simulator-currency.ts --sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
