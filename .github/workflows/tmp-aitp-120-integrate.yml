name: Temporary AITP-120 integration

on:
  push:
    branches:
      - fix/issue-120-guided-layout

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/issue-120-guided-layout

      - name: Merge current main and finish responsive regression fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          panel = Path("src/components/workspace/CopilotPanel.tsx")
          text = panel.read_text()
          old = 'className="absolute right-0 top-9 z-30 w-[28rem] rounded-md border border-border bg-panel p-3 shadow-2xl"'
          new = 'className="absolute right-0 top-9 z-30 w-[calc(100vw-1.5rem)] max-w-[28rem] rounded-md border border-border bg-panel p-3 shadow-2xl"'
          if old not in text:
              raise SystemExit("Copilot panel class anchor not found")
          panel.write_text(text.replace(old, new, 1))

          spec = Path("e2e/tests/copilot-basics.spec.ts")
          text = spec.read_text()
          anchor = '''  await expect(chat).toBeVisible();\n  expect(\n    await chat.evaluate((element) => {\n      const rect = element.getBoundingClientRect();\n      const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + 50);\n      return hit !== null && element.contains(hit);\n    }),\n  ).toBe(true);\n'''
          replacement = anchor + '''  await page.setViewportSize({ width: 323, height: 646 });\n  const narrowChatBox = await chat.boundingBox();\n  expect(narrowChatBox).not.toBeNull();\n  expect(narrowChatBox!.x).toBeGreaterThanOrEqual(0);\n  expect(narrowChatBox!.x + narrowChatBox!.width).toBeLessThanOrEqual(323);\n  await page.setViewportSize({ width: 1280, height: 720 });\n'''
          if anchor not in text:
              raise SystemExit("Copilot E2E anchor not found")
          spec.write_text(text.replace(anchor, replacement, 1))
          PY

          npx prettier --write src/components/workspace/CopilotPanel.tsx e2e/tests/copilot-basics.spec.ts
          rm .github/workflows/tmp-aitp-120-integrate.yml
          git add -A
          git commit -m "fix: integrate responsive training layout"
          git push origin HEAD:fix/issue-120-guided-layout
