name: Fix Copilot context seed

on:
  push:
    branches:
      - fix/remove-temporary-aitp155-runner

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-temporary-aitp155-runner
          fetch-depth: 0

      - name: Remove over-broad Copilot chat response seed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'content/scenarios/copilot-basics.guided.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (data.environment?.seed) {
            delete data.environment.seed.chatResponses;
          }
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-copilot-context-seed.yml
          git config user.name "dimto13"
          git config user.email "93082815+dimto13@users.noreply.github.com"
          git add content/scenarios/copilot-basics.guided.json .github/workflows/fix-copilot-context-seed.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix Copilot context response matching"
          git push origin HEAD:fix/remove-temporary-aitp155-runner
