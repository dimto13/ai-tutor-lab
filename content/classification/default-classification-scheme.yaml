# Standard-Ausgangsschema. Mandanten können Stufen, Indikatoren und KI-Policies ersetzen.
classificationScheme:
  tenantId: default
  levels:
    - id: public
      label: Öffentlich
      rank: 0
    - id: internal
      label: Intern
      rank: 10
    - id: confidential
      label: Vertraulich
      rank: 20
    - id: strictly_confidential
      label: Streng vertraulich
      rank: 30
  indicators:
    - id: personal_data
      label: Personenbezogene Daten
      minLevel: confidential
    - id: customer_contract_data
      label: Kundendaten mit Vertragsbezug
      minLevel: confidential
    - id: salary_data
      label: Gehalts-/HR-Daten
      minLevel: strictly_confidential
    - id: marking_internal
      label: Kennzeichnung intern
      minLevel: internal
  aiPolicy:
    - tool: m365-copilot-tenant
      maxLevel: confidential
    - tool: public-ai-chat
      maxLevel: public
    - tool: github-copilot
      maxLevel: internal
  defaultOnUncertainty: escalate
