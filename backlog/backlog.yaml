    acceptance:
      - Auswertungen erst ab n gleich 5 Personen sichtbar
      - Abbruchpunkte je Schritt identifizierbar (Grundlage für Content-Verbesserung)
      - Export als CSV
    depends_on: [AITP-71, AITP-110]

  - id: AITP-73
    epic: EP-08
    title: Zuweisung von Curricula an Gruppen
    type: story
    priority: C
    estimate: 5
    milestone: M5
    requirements: [FR-67]
    description: Pflichtcurricula je Rolle oder Abteilung zuweisen und deren Erfüllung verfolgen.
