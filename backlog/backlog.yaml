      - Abweichungen erzeugen automatisch Tickets und markieren betroffene Szenarien

  # ---------------- EP-13 ----------------
  - id: AITP-120
    epic: EP-13
    title: Klassifizierungsschema als mandantenkonfigurierbares Datenmodell
    type: story
    priority: M
    estimate: 5
    milestone: M2
    requirements: [FR-70]
    description: >
      ClassificationScheme mit Stufen in Rangfolge, Indikatoren mit Mindeststufe,
      KI-Freigabematrix und Unsicherheitsregel gemäß docs/10 §10.3. Standardschema
      öffentlich/intern/vertraulich/streng vertraulich als Ausgangspunkt; ein vorhandenes
      Firmenschema (z. B. aus ISO-27001-Richtlinie) muss übernehmbar sein.
    acceptance:
      - Schema ist als YAML mit JSON-Schema-Validierung ablegbar
      - Mehrere ausgelöste Indikatoren ergeben die höchste Mindeststufe
      - Freigabematrix ordnet jedem KI-Werkzeug eine maximale Stufe zu
      - Lernmodul und Dokumenten-Check lesen dasselbe Schema
    depends_on: [AITP-1]

  - id: AITP-121
    epic: EP-13
    title: Classification-Simulator als Runtime-Adapter
    type: story
    priority: M
    estimate: 8
    milestone: M2
    requirements: [FR-71, NFR-07]
    description: >
      Einfacher Adapter mit Dokumentvorschau und Zuordnungsinteraktion (Dokument ansehen,
      Merkmale markieren, Stufe wählen, KI-Entscheidung treffen). Implementiert das
      RuntimeAdapter-Interface und besteht die Contract-Tests - dritter Generizitätsbeweis.
    acceptance:
      - Adapter besteht die Contract-Testsuite ohne Sonderbehandlung
      - Synthetische Dokumente werden aus Content-Dateien geladen, nicht hart codiert
      - Emittiert Events wie document.viewed, indicator.marked, level.selected
      - Keine Änderung an packages/training-engine nötig (per Diff belegt)
    depends_on: [AITP-20, AITP-111]

  - id: AITP-122
    epic: EP-13
    title: Lernmodul "Datenklassifizierung & KI-Nutzung" in allen drei Modi
    type: story
    priority: M
    estimate: 13
    milestone: M3
    requirements: [FR-71, FR-72]
    description: >
      Explore (Stufen und Merkmale erkunden), Guided (fünf synthetische Beispieldokumente
      mit Begründung einordnen), Challenge (zehn Dokumente selbstständig klassifizieren und
      je Dokument die KI-Entscheidung treffen). Neuer Validatortyp classification mit
      near-miss-Begründung des übersehenen Merkmals. Ausschließlich synthetische Dokumente.
    acceptance:
      - Alle drei Szenarien laufen fehlerfrei durch
      - near-miss nennt konkret das übersehene oder falsch bewertete Merkmal
      - Die Regel "im Zweifel höher einstufen" ist Lerninhalt und wird in der Challenge belohnt
      - Challenge-Bestehen erzeugt einen Kompetenznachweis mit Lernzielen
      - Kein einziges echtes Dokument ist Bestandteil des Moduls
    depends_on: [AITP-120, AITP-121, AITP-11]

  - id: AITP-123
    epic: EP-13
    title: Synthetischer Dokumentenkorpus mit Grenzfällen
    type: story
    priority: M
    estimate: 5
    milestone: M2
    requirements: [FR-71]
    description: >
      Mindestens 20 synthetische Dokumente (Angebot, Gehaltsliste, Pressemitteilung,
      Kundenvertrag, Meeting-Notiz, Organigramm, Quellcode-Auszug, Support-Ticket u. a.)
      mit dokumentierter Soll-Klassifizierung und den auslösenden Merkmalen. Bewusst
      inklusive Grenzfällen (z. B. interne Notiz mit einem einzelnen Personennamen).
      Dient zugleich als Testkorpus für die Klassifizierungs-Engine.
    acceptance:
      - Jedes Dokument hat Soll-Stufe, Soll-KI-Entscheidung und Merkmalsliste
      - Mindestens fünf dokumentierte Grenzfälle
      - Alle Namen, Firmen und Zahlen sind erfunden und als solche gekennzeichnet
    depends_on: [AITP-120]

  - id: AITP-124
    epic: EP-13
    title: Klassifizierungs-Engine Stufe 1+2 - Kennzeichnungs- und Mustererkennung
    type: story
    priority: S
    estimate: 8
    milestone: M4
    requirements: [FR-76, FR-77]
    description: >
      Deterministische Analyse ohne LLM - vorhandene Vertraulichkeitsvermerke und
      Dokumenteigenschaften erkennen (Stufe 1), Muster für Personenbezug, Kunden- und
      Vertragsdaten, Gehalts-/HR-Daten, Finanzkennzahlen sowie mandantenspezifische
      Schlüsselwortlisten (Stufe 2). Asymmetrisch konservativ - bei Unsicherheit höhere
      Stufe plus Hinweis auf menschliche Prüfung.
    acceptance:
      - Engine läuft vollständig ohne Netzwerkzugriff auf externe Modelle
      - Gegen den Testkorpus aus AITP-123 keine False Negatives bei streng vertraulich
      - Unsicherheitsfälle werden als solche gekennzeichnet, nicht still entschieden
      - Unterstützte Formate mindestens PDF, DOCX, XLSX, TXT
    depends_on: [AITP-120, AITP-123]

  - id: AITP-125
    epic: EP-13
    title: Dokumenten-Check-Dienst in dedizierter Mandanten-Boundary
    type: story
    priority: S
    estimate: 13
    milestone: M4
    requirements: [FR-73, FR-74, FR-75]
    description: >
      Upload, Analyse im Speicher, Ergebnisansicht mit Stufe, erkannten Merkmalen,
      Freigabematrix und Empfehlungs-Disclaimer. Deployment je Firma in eigener Umgebung
      (eigenes Konto/eigene DB), niemals in der geteilten Plattform-Datenbank.
      Dokumentinhalte werden nicht persistiert und erscheinen in keinem Log.
    acceptance:
      - Ergebnis zeigt immer Stufe, Begründung, Freigabematrix und Disclaimer
      - Nach der Analyse ist der Inhalt nachweislich nicht mehr gespeichert
      - Persistiert werden nur Zeitstempel, Dateityp, Stufe, Merkmals-IDs, Nutzer-ID
      - Jedes Ergebnis verlinkt auf die passende Lerneinheit des Klassifizierungsmoduls
      - Deployment-Anleitung für eine dedizierte Mandanteninstanz liegt vor
    depends_on: [AITP-124, AITP-84]

  - id: AITP-126
    epic: EP-13
    title: LLM-Bewertungsstufe innerhalb der Mandanten-Boundary (optional)
    type: story
    priority: C
    estimate: 8
    milestone: M5
    requirements: [FR-76]
    description: >
      Kontextverständnis für Grenzfälle über ein Modell, das in der Boundary des Mandanten
      läuft (z. B. Bedrock im Firmenkonto). Externes API nur mit ausdrücklichem,
      dokumentiertem Opt-in des Mandanten. Die LLM-Stufe darf eine regelbasierte Einstufung
      nur erhöhen oder bestätigen, nie senken.
    acceptance:
      - Ohne konfiguriertes Boundary-Modell bleibt der Check voll funktionsfähig
      - LLM-Ergebnis kann eine Stufe nie herabsetzen
      - Datenfluss ist dokumentiert und je Mandant abschaltbar
    depends_on: [AITP-125]

  - id: AITP-127
    epic: EP-13
    title: Rechtliche Positionierung und Datenflussprüfung des Dokumenten-Checks
    type: task
    priority: S
    estimate: 3
    milestone: M4
    requirements: [FR-78, FR-79]
    description: >
      Externe Prüfung - Haftungspositionierung als Empfehlung, DSGVO-Bewertung der
      Verarbeitung (Auftragsverarbeitung, Rechtsgrundlage, Löschkonzept), technische
      Datenflussprüfung (kein Inhalt in Logs, Telemetrie, Backups). Ergebnis fließt in
      Disclaimer-Texte und Vertragsanlagen ein.
    acceptance:
      - Schriftliche rechtliche Einschätzung liegt vor
      - Datenflussprüfung mit Ergebnisprotokoll durchgeführt
      - Disclaimer- und AVV-Texte sind abgestimmt
    depends_on: [AITP-125]

  - id: AITP-128
    epic: EP-13
    title: Aggregiertes Reporting des Dokumenten-Checks für Informationssicherheit
    type: story
    priority: C
    estimate: 5
    milestone: M5
    requirements: [FR-79]
    description: >
      Aggregierte Auswertung (Verteilung der Stufen, häufigste Merkmale, Trend) für die
      Informationssicherheit - ohne personenbezogene Einzelauswertung, gemäß den
      Sichtbarkeitsstufen aus docs/05 §5.6.
    acceptance:
      - Auswertungen erst ab n gleich 5 Prüfvorgängen sichtbar
      - Keine Ansicht verknüpft Person und geprüftes Einzeldokument
      - Export als CSV
    depends_on: [AITP-125, AITP-100]
