      - Szenario besteht die Schema-Validierung
    depends_on: [AITP-90, AITP-10]

  - id: AITP-92
    epic: EP-10
    title: Modul "VS Code Grundlagen" mit allen drei Modi
    type: story
    priority: M
    estimate: 13
    milestone: M2
    requirements: [FR-20, FR-21, FR-22, FR-32]
