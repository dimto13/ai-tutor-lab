  - id: AITP-93
    epic: EP-10
    title: Begriffskatalog (Glossar) als Content-Quelle
    type: story
    priority: S
    estimate: 3
    milestone: M2
    requirements: [FR-45]
    description: >
      Zentrale Begriffsdefinitionen (Workspace, Repository, Working Tree, Stage, Commit,
      Branch, Extension, Prompt, Kontext), referenzierbar aus Schritten und Tutor.
    acceptance:
      - Jeder Begriff hat eine einfache Erklärung und eine Vertiefung
      - Tutor beantwortet Begriffsfragen ausschließlich aus dieser Quelle
