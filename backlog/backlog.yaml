  - id: AITP-94
    epic: EP-10
    title: Autorenvorschau für Szenarien
    type: story
    priority: C
    estimate: 8
    milestone: M4
    requirements: [FR-08]
    description: >
      Szenario laden, Schritt für Schritt simulieren, Zielauflösung und Validatoren prüfen -
