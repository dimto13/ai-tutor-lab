version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci --install-strategy=nested
        build:
          commands:
            - VITE_APP_VERSION=$(node -p "require('./apps/web/package.json').version") VITE_APP_COMMIT_SHA=${AWS_COMMIT_ID:-unknown} npm run build
      artifacts:
        baseDirectory: apps/web/.amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
