version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci --install-strategy=nested
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: apps/web/.amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
