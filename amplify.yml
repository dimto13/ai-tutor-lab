version: 1
applications:
  # appRoot muss identisch zur Env-Variable AMPLIFY_MONOREPO_APP_ROOT sein (apps/web).
  #
  # buildPath: / laesst alle Phasen im Repo-Root laufen. Das ist noetig, weil npm
  # Workspaces nur vom Root aus installiert werden koennen -- und es ersetzt die
  # frueheren "cd ../.."-Praefixe. Die waren der eigentliche Build-Killer: Amplify
  # fuehrt preBuild und build in derselben Shell aus, das cd aus preBuild wirkte also
  # in build fort, und das zweite cd landete oberhalb des Repos
  # ("Cannot find module './apps/web/package.json'").
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            # buildPath gilt nur fuer frontend, die backend-Phase kennt den Schluessel
            # nicht. ampx muss laut CLI im Elternverzeichnis von amplify/ laufen, also
            # im Repo-Root. Der Test macht das idempotent: Er wechselt nur, wenn wir
            # nicht ohnehin schon dort stehen -- kein zweites "cd ../.." wie in Job 4/5/6.
            - test -f amplify/backend.ts || cd ../..
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
            # Der Auth-Adapter laedt die Outputs zur Laufzeit per fetch("/amplify_outputs.json").
            # Ausgeliefert wird apps/web/public/ -> .amplify-hosting/static/, also hierhin kopieren.
            - cp amplify_outputs.json apps/web/public/amplify_outputs.json
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v && npm -v
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - VITE_APP_VERSION=$(node -p "require('./apps/web/package.json').version") VITE_APP_COMMIT_SHA=${AWS_COMMIT_ID:-unknown} npm run build
      artifacts:
        # baseDirectory ist relativ zu buildPath (Repo-Root), nicht zu appRoot.
        baseDirectory: apps/web/.amplify-hosting
        files:
          - "**/*"
      cache:
        # npm-Cache statt node_modules: npm ci loescht node_modules ohnehin bei jedem Lauf.
        paths:
          - .npm/**/*
