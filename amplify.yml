version: 1
applications:
  # appRoot muss identisch zur Amplify-Env-Variable AMPLIFY_MONOREPO_APP_ROOT sein.
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            # Backend-Phasen koennen im appRoot starten; nur bei Bedarf einmal zum Repo-Root wechseln.
            - test -f amplify/backend.ts || cd ../..
            - nvm install 22
            - nvm use 22
            - node -v && npm -v
            # Amplify/CDK enthaelt gebuendelte Abhaengigkeiten; die erzwungene nested-Strategie
            # kollidiert damit. Der Lockfile bleibt mit normalem npm ci strikt reproduzierbar.
            - npm ci --cache .npm --prefer-offline
            # Gen-2-Backend deployen und die Client-Konfiguration direkt fuer den Frontend-Build erzeugen.
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir apps/web/public
    frontend:
      # buildPath: / laesst die Frontend-Phasen im Repo-Root laufen, damit npm Workspaces
      # reproduzierbar vom selben Ort wie in GitHub CI installiert und gebaut werden.
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v && npm -v
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - VITE_APP_VERSION=$(node -p "require('./apps/web/package.json').version") VITE_APP_COMMIT_SHA=${AWS_COMMIT_ID:-unknown} npm run build
      artifacts:
        # baseDirectory ist relativ zu buildPath, daher vom Repo-Root aus angegeben.
        baseDirectory: apps/web/.amplify-hosting
        files:
          - "**/*"
      cache:
        # npm ci verwirft node_modules; gecacht wird deshalb nur der npm-Download-Cache.
        paths:
          - .npm/**/*
